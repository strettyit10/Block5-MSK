<!doctype html><html><head><meta charset="utf-8"></head><body><title>MSK Path &amp; Pharm Bell Ringer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Extra+Condensed:wght@500;700;800&display=swap">
<style>
:root{
  --ground:#EEF3F0; --panel:#FFFFFF; --sunk:#E2EAE6; --line:#C9D6D0;
  --ink:#13201D; --muted:#566963;
  --p1:#E3AE12; --p1-ink:#7A5B00; --p1-soft:#FBF1CF;
  --p2:#2E86C8; --p2-ink:#155987; --p2-soft:#DDEDF8;
  --good:#1E8A57; --good-soft:#DCF2E6; --bad:#C2412F; --bad-soft:#F8E1DC;
  --hy-bg:#FFF4C2; --hy-line:#D4A300; --hy-ink:#4A3A00;
  --plate:#0E1413;
  --display:"Saira Extra Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121A19; --panel:#1B2523; --sunk:#16201E; --line:#2D3B38;
    --ink:#DDE7E3; --muted:#8FA39D;
    --p1:#F2C230; --p1-ink:#F5CD4E; --p1-soft:#2E2A14;
    --p2:#5BB0E6; --p2-ink:#7DC2EE; --p2-soft:#15293A;
    --good:#4CC38A; --good-soft:#15301F; --bad:#EE6E5A; --bad-soft:#3A1D18;
    --hy-bg:#342D0E; --hy-line:#C9A227; --hy-ink:#F4E3A1;
    --plate:#080C0B;
  }
}
:root[data-theme="dark"]{
    --ground:#121A19; --panel:#1B2523; --sunk:#16201E; --line:#2D3B38;
    --ink:#DDE7E3; --muted:#8FA39D;
    --p1:#F2C230; --p1-ink:#F5CD4E; --p1-soft:#2E2A14;
    --p2:#5BB0E6; --p2-ink:#7DC2EE; --p2-soft:#15293A;
    --good:#4CC38A; --good-soft:#15301F; --bad:#EE6E5A; --bad-soft:#3A1D18;
    --hy-bg:#342D0E; --hy-line:#C9A227; --hy-ink:#F4E3A1;
    --plate:#080C0B;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.55 var(--body);padding-inline:16px;padding-block:18px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.brand{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand b{color:var(--p1-ink)}
.tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ---------- setup ---------- */
.setup{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
.hero h1{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(46px,7vw,86px);line-height:.88;margin:6px 0 14px;text-wrap:balance}
.hero h1 span{display:block;color:var(--muted);font-weight:500}
.hero p{max-width:52ch;color:var(--muted);margin:0 0 16px}
.rules{display:grid;gap:8px;margin:0;padding:0;list-style:none;max-width:56ch}
.rules li{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:baseline;border-top:1px dashed var(--line);padding-top:8px}
.rules b{font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.form{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:18px}
.fl{display:flex;flex-direction:column;gap:6px}
.fl>label,.fl>.lab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:9px 10px;border-left:5px solid var(--p1)}
.names input#p2name{border-left-color:var(--p2)}
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--sunk)}
.chk input{accent-color:var(--p1);width:17px;height:17px}
.chk span{flex:1}
.chk em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;background:var(--sunk);border:0;padding:9px 8px;border-right:1px solid var(--line);min-width:70px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:600}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.go{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.05em;text-transform:uppercase;background:var(--p1);color:#1a1400;border:0;border-radius:4px;padding:10px 16px}
.go:disabled{opacity:.4;cursor:not-allowed}

/* ---------- scoreboard ---------- */
.board{display:grid;grid-template-columns:1fr auto 1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.pl{display:flex;align-items:center;gap:14px;padding:10px 16px;position:relative;transition:background .2s}
.pl.p2{flex-direction:row-reverse;text-align:right}
.pl .nm{font-weight:600;font-size:15px}
.pl .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.pl .sc{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums;margin-left:auto}
.pl.p2 .sc{margin-left:0;margin-right:auto}
.pl.p1 .sc{color:var(--p1-ink)} .pl.p2 .sc{color:var(--p2-ink)}
.pl.on.p1{background:var(--p1-soft);box-shadow:inset 0 -4px 0 var(--p1)}
.pl.on.p2{background:var(--p2-soft);box-shadow:inset 0 -4px 0 var(--p2)}
.pl .key{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:var(--muted)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 18px;border-inline:1px solid var(--line);background:var(--sunk);min-width:120px}
.mid .st{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.bell{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bell i{display:block;height:100%;background:var(--ink);transform-origin:left;transition:transform .25s linear}
.bell.warn i{background:var(--bad)}

/* ---------- station ---------- */
.station{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start}
.station.noimg{grid-template-columns:minmax(0,1fr)}
.station.noimg .qcol{max-width:860px}
.plate{background:var(--plate);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.plate img{width:100%;max-height:70vh;object-fit:contain;display:block}
.plate .cap{font-family:var(--mono);font-size:11px;color:#9FB2AC;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.qcol{display:flex;flex-direction:column;gap:14px}
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:3px;border:1px solid var(--line);background:var(--panel)}
.chip.p1{background:var(--p1);color:#1a1400;border-color:var(--p1)}
.chip.p2{background:var(--p2);color:#fff;border-color:var(--p2)}
.chip.steal{background:transparent;border-style:dashed}
.stem{font-size:16.5px;line-height:1.6;margin:0;max-width:72ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:9px 12px;transition:border-color .15s,transform .1s}
.opt .lt{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;width:30px;height:30px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:50%}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:active:not(:disabled){transform:translateY(1px)}
.opt:disabled{cursor:default}
.opt.out{opacity:.38;text-decoration:line-through}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right .lt{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .lt{background:var(--bad);border-color:var(--bad);color:#fff}
.buzz{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.buzz button{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.04em;border:0;border-radius:5px;padding:14px 8px;line-height:1.05}
.buzz button small{display:block;font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.06em;opacity:.8}
.buzz .b1{background:var(--p1);color:#1a1400} .buzz .b2{background:var(--p2);color:#fff}
.verdict{border-radius:5px;padding:12px 14px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:8px}
.verdict h3{margin:0;font-family:var(--display);font-size:26px;font-weight:800;text-transform:uppercase;line-height:1}
.verdict.good h3{color:var(--good)} .verdict.bad h3{color:var(--bad)}
.verdict p{margin:0;max-width:72ch}
.why-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.why-list b{color:var(--ink);font-family:var(--mono);font-weight:600;margin-right:6px}
.hy{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:5px;padding:10px 12px;font-size:14px}
.hy b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--ground);border:0;border-radius:4px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--muted)}

.zbtn{padding:0;border:0;background:none;cursor:zoom-in;display:block;width:100%}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(5,8,8,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:88vh;object-fit:contain;border-radius:4px}
.zoom span{font-family:var(--mono);font-size:11px;color:#9FB2AC;letter-spacing:.08em;text-transform:uppercase}

/* ---------- results ---------- */
.res{display:flex;flex-direction:column;gap:22px}
.res h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(40px,6vw,70px);line-height:.9;margin:0;text-wrap:balance}
.res h2 .w1{color:var(--p1-ink)} .res h2 .w2{color:var(--p2-ink)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px;border-top:5px solid var(--p1)}
.card.c2{border-top-color:var(--p2)}
.card .big{font-family:var(--display);font-weight:800;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400}
td.n,th.n{text-align:right}
.missed{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.missed li{font-size:13.5px;border-left:3px solid var(--line);padding-left:9px}
.missed li span{font-family:var(--mono);font-size:11px;color:var(--muted);display:block}
.foot{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
@media (max-width:820px){
  .setup,.station,.cards{grid-template-columns:1fr}
  .plate{position:static}
  .pl{padding:8px 10px;gap:8px}.pl .sc{font-size:34px}.pl .meta,.pl .key{display:none}
  .mid{min-width:78px;padding:6px 8px}.mid .st{font-size:22px}
  .names{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1.25)}100%{transform:scale(1)}}

/* ---------- return to hub (added Sep 22, 2026) ---------- */
.tohub{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  font-family:var(--mono,var(--pix,ui-monospace,Menlo,monospace));font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;line-height:1;
  transition:color .12s,border-color .12s,background .12s}
.tohub:hover{color:var(--ink);border-color:var(--muted);background:var(--sunk)}
.tohub:focus-visible{outline:2px solid var(--p2,var(--p1,currentColor));outline-offset:2px}
.tohub svg{width:13px;height:13px;flex:none;transition:transform .12s}
.tohub:hover svg{transform:translateX(-2px)}
@media print{.tohub{display:none}}
</style>

const Q=[{"id": "MB1", "set": "PM", "stem": "A 29-year-old woman, G3, P2, gives birth to an infant following an uncomplicated pregnancy. The infant's height is below the fifth percentile. On physical examination, the infant's torso and head size are normal, but the extremities are short. The forehead appears prominent. Radiographs show short, slightly bowed long bones, but no osteopenia. The other two children in the family are of normal height. The affected child has no difficulty with activities of daily living after modifications are made in the home and school for short stature and later becomes a physician. Which of the following conditions is likely to be present in this child?", "opts": ["Achondroplasia", "Hurler syndrome", "Osteogenesis imperfecta", "Rickets", "Scurvy", "Thanatophoric dysplasia"], "ans": 0, "why": "Short limbs with a normal trunk and head, frontal bossing, normal bone density and normal intelligence = achondroplasia. It is usually a spontaneous new FGFR3 mutation (unaffected siblings fit), which impairs growth-plate cartilage proliferation and so mainly affects endochondral bone growth. The homozygous form is lethal in utero.", "wrong": ["", "Hurler syndrome (MPS I): normal at birth, then growth failure, intellectual disability, hepatosplenomegaly and stiff joints.", "Osteogenesis imperfecta presents with fractures from severe osteopenia; bone density here is normal.", "Rickets (vitamin D deficiency in childhood) causes poor mineralization and bowing, but not this dwarfism.", "Scurvy (vitamin C deficiency) gives abnormal bone matrix with mild deformity, not dwarfism.", "Thanatophoric dysplasia is also FGFR3, but it is the most common LETHAL dwarfism; this child thrives."], "pearl": "Achondroplasia: FGFR3 gain-of-function, usually sporadic (↑ paternal age), short limbs + normal trunk, normal IQ. Thanatophoric = lethal FGFR3."}, {"id": "MB2", "set": "PM", "stem": "A 14-year-old girl who was healthy at birth now has bilateral hearing loss. Audiometry indicates bilateral mixed conductive and sensorineural hearing loss. CT scan of the head shows maldevelopment of both middle ears with deficient ossification. Further history indicates that her dentist has tried various whiteners to diminish the yellow-brown color of her teeth, which have a slight bell-shaped appearance. The optometrist noted that her sclerae have a peculiar steel-gray color, and her vision is 20/40. At age 30 years, she falls and fractures the left femur. A radiograph shows that the femur is osteopenic. Bone densitometry reveals osteopenia of all measured sites. Which of the following molecular mechanisms is most likely to produce these findings?", "opts": ["Deficient hypoxanthine-guanine phosphoribosyltransferase (HGPRT) activity", "Diminished osteoprotegerin binding to macrophage RANK receptor", "Failure of type I collagen formation by osteoblasts", "Fibroblast growth factor receptor 3 inhibition of cartilage proliferation", "Increased interleukin-6 production by osteoblasts", "Reduced number of vitamin D receptors"], "ans": 2, "why": "Hearing loss, discolored teeth (dentinogenesis imperfecta), blue-gray sclerae and osteopenic fractures = osteogenesis imperfecta, most likely type I. Defective type I collagen made by osteoblasts gives brittle bones, thin sclerae, abnormal dentin and abnormal ossicles.", "wrong": ["Absent HGPRT is Lesch-Nyhan syndrome (X-linked, hyperuricemia, self-mutilation).", "Altered OPG/RANKL signaling is part of the mechanism of osteoporosis, not this syndrome.", "", "FGFR3 mutations cause achondroplasia.", "Increased IL-6 from osteoblasts occurs in Paget disease and after menopause.", "Reduced vitamin D action leads to rickets or osteomalacia."], "pearl": "OI: type I collagen → fractures, blue sclerae, hearing loss, dental imperfections. Type I mild; type II perinatal lethal."}, {"id": "MB3", "set": "PM", "stem": "A 70-year-old man complains of right hip and thigh pain of 8 months' duration. On physical examination, he has reduced range of motion in both hips, but there is no tenderness or swelling on palpation. Radiographs of the pelvis and right leg show sclerotic, thickened cortical bone with a narrowed joint space near the acetabulum. Laboratory studies show a serum alkaline phosphatase level of 173 U/L, calcium of 9.5 mg/dL, and phosphorus of 3.4 mg/dL. Which of the following conditions is most likely to produce these findings?", "opts": ["Degenerative osteoarthritis", "Hyperparathyroidism", "Osteochondroma", "Paget disease of bone", "Vitamin D deficiency"], "ans": 3, "why": "An older man with thick, sclerotic cortical bone, an isolated raised alkaline phosphatase and normal calcium and phosphate = Paget disease (osteitis deformans). It runs through lytic, mixed (osteolysis + osteosclerosis, giving the mosaic pattern of lamellar bone) and burnt-out sclerotic phases. Joints next to affected bone develop secondary osteoarthritis, which explains the narrowed hip joint.", "wrong": ["Osteoarthritis narrows the joint space but doesn’t thicken the cortex or raise alkaline phosphatase.", "Hyperparathyroidism raises calcium and lowers phosphate; its bone lesion is osteitis fibrosa cystica.", "An osteochondroma is a cartilage-capped bony projection from a long-bone metaphysis.", "", "Vitamin D deficiency in adults causes osteomalacia, with osteopenia rather than sclerosis, and usually low calcium/phosphate."], "pearl": "Paget: ↑ALP alone (Ca, PO₄ normal), mosaic lamellar bone, thick cortex; risks = high-output heart failure, osteosarcoma, hearing loss."}, {"id": "FJ1", "set": "PF", "stem": "A 28-year-old man flips over an all-terrain vehicle, and he lands on his leg. On physical examination there is intense pain on palpation over the right shin, but there is no shortening of the limb. The overlying skin is intact. A radiograph shows right tibial and fibular midshaft fracture into multiple bone fragments. Which of the following terms best describes these fractures?", "opts": ["Comminuted", "Compound", "Displaced", "Incomplete", "Pathologic"], "ans": 0, "why": "A bone broken into multiple fragments is a comminuted fracture. It usually needs orthopedic hardware to align the fragments for healing.", "wrong": ["", "A compound (open) fracture breaks through the skin; here the skin is intact.", "A displaced fracture has non-aligned ends; no shortening or deformity is described.", "An incomplete fracture doesn’t extend all the way across the bone.", "A pathologic fracture occurs through bone weakened by disease, such as a metastasis; this was high-energy trauma."], "pearl": "Comminuted = splintered into fragments. Compound/open = through the skin. Pathologic = through diseased bone."}, {"id": "FJ2", "set": "PF", "stem": "A 26-year-old woman has had malaise, arthralgias, and myalgias for the past 2 months. On physical examination, there is no joint swelling or deformity. Laboratory studies show a serum creatinine level of 3.9 mg/dL. A renal biopsy specimen shows proliferative glomerulonephritis. She receives glucocorticoid therapy for 3 months. She now has left hip pain with movement. On physical examination, there is no swelling or deformity. A radiograph of the left leg and pelvis shows patchy radiolucency and density of the femoral head with flattening of the bone. A total replacement of the left hip is performed, and gross examination of the sectioned femoral head shows collapse of articular cartilage over a pale, wedge-shaped, subchondral area. What is the most likely diagnosis?", "opts": ["Avascular necrosis", "Enchondroma", "Osteoarthritis", "Osteomyelitis", "Renal osteodystrophy"], "ans": 0, "why": "A pale, wedge-shaped subchondral infarct with collapse of the overlying cartilage in the femoral head = avascular necrosis (osteonecrosis). This patient (likely SLE with lupus nephritis) received glucocorticoids, which reduce osteoblastogenesis and promote osteonecrosis. Other causes include sickle cell disease, fracture, barotrauma, hypercoagulable states and alcohol.", "wrong": ["", "An enchondroma is a benign hyaline cartilage tumor in the medullary cavity of small bones.", "Osteoarthritis erodes cartilage but doesn’t cause a wedge-shaped bone infarct with collapse.", "Osteomyelitis is less localized and produces irregular reactive new bone (involucrum).", "Renal osteodystrophy takes much longer to develop and causes lesions like osteitis fibrosa cystica."], "pearl": "Femoral head AVN: steroids, sickle cell, alcohol, SLE, trauma. Pale wedge-shaped subchondral infarct → crescent sign → collapse."}, {"id": "FJ3", "set": "PF", "stem": "A 7-year-old boy sustained an open compound fracture of the right tibia and fibula in a fall from a barn loft to the floor below. On physical examination, the lower tibia and fibula can be seen protruding from the lower leg. The fracture is set by external manipulation, and the skin wound is sutured, but nothing more is done. One year later, he continues to have pain in the right leg, and a draining sinus tract has developed in the lateral lower right leg. A radiograph of the lower right leg is now most likely to show which of the following?", "opts": ["Cortical nidus with surrounding sclerosis", "Involucrum and sequestrum", "Osteolysis with osteosclerosis", "Soft tissue hemorrhage and swelling", "Tumor mass with bony destruction"], "ans": 1, "why": "An inadequately treated open fracture became infected by direct extension and progressed to chronic osteomyelitis. Infection and vascular compromise kill a fragment of bone (sequestrum), and with time a shell of reactive new bone (involucrum) forms around it. A draining sinus tract is typical.", "wrong": ["A cortical nidus with surrounding sclerosis is osteoid osteoma.", "", "Mixed osteolysis and osteosclerosis is the remodeling pattern of Paget disease.", "Soft tissue hemorrhage and swelling resolve soon after a fracture is stabilized.", "A destructive mass would suggest malignancy; squamous cell carcinoma can rarely arise in a chronic sinus tract, but it is uncommon."], "pearl": "Chronic osteomyelitis: sequestrum (dead bone) + involucrum (new bone shell) + draining sinus. Rare late complication: SCC in the sinus tract (Marjolin)."}, {"id": "BN1", "set": "PN", "img": "N1", "cap": "Gross specimen, sectioned proximal femur", "stem": "A 45-year-old man has experienced pain in the area of the left hip and upper thigh for the past 7 months. On physical examination, there is tenderness on deep palpation of the left side of the groin. The range of motion at the left hip is decreased, but there is no swelling or warmth on palpation. Pelvic and left leg radiographs show an upper femoral metaphyseal mass lesion that erodes into the surrounding bone cortex. The proximal femur is excised and on sectioning has the gross appearance shown. Which of the following cell types is most likely to be proliferating in this mass?", "opts": ["Chondrocyte", "Osteoblast", "Osteoclast", "Plasma cell", "Primitive neuroectodermal cell"], "ans": 0, "why": "The glistening, gray-blue cut surface is typical of cartilage, so this is a neoplastic proliferation of chondrocytes: chondrosarcoma. It fills the medullary cavity and erodes the cortex, features of malignancy. Chondrosarcomas occur over a broad age range (often middle age) and favor the central skeleton (pelvis, proximal femur, shoulder girdle); most are low grade.", "wrong": ["", "Osteoblasts proliferate in osteoid osteoma, osteoblastoma and (malignant) osteosarcoma; osteosarcoma affects younger patients and makes osteoid, not blue-white cartilage.", "Osteoclast-like giant cells mark giant cell tumor: red-brown, cystic, epiphyseal, ages 20–40.", "Atypical plasma cells form multiple myeloma: multiple dark-red, rounded lytic lesions in older adults.", "Primitive neuroectodermal (small round blue) cells are Ewing sarcoma, in children and teens."], "pearl": "Chondrosarcoma: middle-aged adult, pelvis/proximal femur/shoulder, glistening blue-gray lobules, cortex eroded."}, {"id": "BN2", "set": "PN", "img": "N2", "cap": "Microscopy of the excised lesion", "stem": "A 38-year-old healthy man notes occasional pain in his right index finger when using a hammer. On palpation of the right proximal phalanx there is point tenderness. A radiograph shows a well-circumscribed 1-cm oval lucency in this phalanx, with a surrounding rim of bright, radiodense bone. The microscopic appearance of the excised lesion is shown. Which of the following most closely resembles what is present in this lesion?", "opts": ["Anaplastic spindle cells", "Foamy macrophages", "Granulomatous inflammation", "Hyaline cartilage", "Plasma cell proliferation"], "ans": 3, "why": "A small, well-circumscribed lucent lesion in a phalanx of a healthy adult = enchondroma, a benign tumor of mature hyaline cartilage. Cartilage lesions in the hands and feet are usually benign; in the central skeleton a low-grade chondrosarcoma is more likely. Multiple enchondromas (Ollier disease, Maffucci syndrome; IDH mutations) carry a higher risk of malignant change.", "wrong": ["Anaplastic spindle cells mean a sarcoma, which would more likely be central and destructive.", "Foamy macrophages accumulate in storage diseases such as Gaucher disease, usually polyostotic marrow involvement.", "Granulomas suggest infection such as tuberculosis, which favors central sites.", "", "Plasma cell proliferation (myeloma) is unlikely at this age and site."], "pearl": "Enchondroma: hands/feet, mature hyaline cartilage. Ollier = multiple enchondromas; Maffucci = enchondromas + hemangiomas (both IDH1/2; ↑ chondrosarcoma risk)."}, {"id": "BN3", "set": "PN", "img": "N3", "cap": "Microscopy of the curettage specimen", "stem": "A 30-year-old woman has experienced pain in the area of the left knee for 1 month. On physical examination, there is tenderness to palpation of the distal left thigh and knee. The area is firm, but there is no erythema or warmth. A radiograph of the left leg shows a 7-cm mass in the distal femoral epiphyseal area, with a “soap bubble” appearance. Microscopic examination of a curettage specimen of the lesion is shown here. The lesion recurs in the next year; it is excised and does not recur again. What is the most likely diagnosis?", "opts": ["Chondrosarcoma", "Enchondroma", "Giant cell tumor", "Osteitis fibrosa cystica", "Osteoblastoma", "Plasmacytoma"], "ans": 2, "why": "An epiphyseal “soap bubble” lesion around the knee in a 20–40-year-old, with osteoclast-like multinucleated giant cells in a stroma of spindle-shaped mononuclear cells, = giant cell tumor of bone. It often recurs after curettage. Most are benign; sarcoma rarely arises in one.", "wrong": ["Chondrosarcomas are typically larger destructive lesions of the central skeleton, made of cartilage.", "Enchondromas are usually in the small tubular bones of the hands and feet.", "", "Osteitis fibrosa cystica (brown tumor) is a complication of hyperparathyroidism; check calcium.", "Osteoblastoma usually involves the spine.", "Plasmacytoma is usually one lesion of multiple myeloma, in older adults."], "pearl": "Giant cell tumor: epiphysis (distal femur/proximal tibia), 20–40 y, soap bubble, RANKL-driven osteoclast-like giant cells, recurs."}, {"id": "ST1", "set": "PS", "stem": "A 20-year-old woman has had discomfort in her abdomen for 4 months. On examination there is a 6-cm firm mass palpable beneath the skin over her left rectus muscle. The mass on excision is not completely circumscribed, so dissection of a margin into adjacent muscle is required. On gross inspection the mass is gray-white, firm, and poorly demarcated. On microscopic examination bland fibroblasts are arranged in broad sweeping fascicles amid dense collagen. Both she and a sibling have undergone total colectomy for polyposis. Which of the following is the most likely diagnosis of the mass involving her abdomen?", "opts": ["Desmoid tumor", "Myositis ossificans", "Neurofibromatosis type 1", "Nodular fasciitis", "Undifferentiated pleomorphic sarcoma"], "ans": 0, "why": "A poorly circumscribed, infiltrative abdominal-wall mass of bland fibroblasts in sweeping fascicles in someone with familial adenomatous polyposis = desmoid tumor (deep fibromatosis), part of Gardner syndrome. It doesn’t metastasize but recurs locally because of its infiltrative growth.", "wrong": ["", "Myositis ossificans follows trauma, ossifies at the periphery and tends to regress.", "NF1 causes neurofibromas and other tumors, but not fibromatoses.", "Nodular fasciitis is a fast-growing reactive lesion, often after trauma, that regresses.", "Undifferentiated pleomorphic sarcoma is a large, highly aggressive deep tumor with pleomorphic cells, not bland fibroblasts."], "pearl": "Desmoid: APC/β-catenin (CTNNB1), FAP/Gardner, abdominal wall after pregnancy, locally aggressive, no metastasis."}, {"id": "ST2", "set": "PS", "stem": "A 57-year-old woman has noticed increasing deformity and difficulty with movement involving her left hand over the past 6 months. On physical examination, there is a contracture involving the third digit of her left hand that prevents her from fully extending this finger. A firm, hard, cordlike 1 × 3 cm area is palpable beneath the skin of the left palm. Microscopically, which of the following is most likely to be seen in greatest abundance composing this lesion?", "opts": ["Atypical spindle cells", "Dystrophic calcification", "Fibroblasts with collagen", "Granulation tissue", "Proliferation of lipoblasts"], "ans": 2, "why": "A cord-like palmar thickening with flexion contracture = Dupuytren contracture, a superficial (palmar) fibromatosis. It is made of mature fibroblasts within dense collagen. It is benign but can be hard to resect completely.", "wrong": ["Some spindle-shaped fibroblasts are present, but they are not numerous or significantly atypical.", "Dystrophic calcification occurs in necrotic tissue and doesn’t form a localized cord.", "", "Granulation tissue after injury leads to a stable scar without this progressive retraction.", "Lipoblasts mark liposarcoma, a deep soft-tissue tumor (thigh, retroperitoneum)."], "pearl": "Superficial fibromatosis: Dupuytren (palm), Ledderhose (sole), Peyronie (penis). Deep fibromatosis: desmoid."}, {"id": "ST3", "set": "PS", "stem": "A 47-year-old man has had dull, constant pain in the midsection of the right thigh for the past 4 months. On physical examination, there is pain on palpation of the anterior right thigh, which worsens with movement. The right thigh appears to have a larger circumference than the left thigh. A radiograph of the right upper leg and pelvis shows no fracture, but there is an ill-defined soft tissue mass anterior to the femur. MRI shows a 10 × 8 × 7 cm solid mass deep to the quadriceps, but it does not involve the femur. Karyotypic analysis of tumor cells reveals t(12;16)(q13;p11) with amplification of MDM2 gene. What is the most likely diagnosis?", "opts": ["Chondrosarcoma", "Liposarcoma", "Metastatic adenocarcinoma", "Nodular fasciitis", "Osteosarcoma", "Rhabdomyosarcoma"], "ans": 1, "why": "A large, deep soft-tissue mass of the thigh in an adult suggests a sarcoma, and liposarcoma is the most common adult sarcoma. The t(12;16) translocation (FUS-DDIT3) marks myxoid liposarcoma, while MDM2 amplification is the hallmark of well-differentiated/dedifferentiated liposarcoma; either points to liposarcoma.", "wrong": ["Chondrosarcoma arises within bone, and this mass spares the femur.", "", "A metastasis this large in soft tissue is unlikely, though carcinomas are more common than sarcomas overall.", "Nodular fasciitis is a small reactive lesion of young adults, often after trauma.", "Osteosarcoma usually affects people under 20 and arises in the metaphysis of a long bone.", "Rhabdomyosarcoma occurs in children, usually in the head and neck or genitourinary tract."], "pearl": "Liposarcoma: most common adult sarcoma, deep thigh/retroperitoneum. MDM2 amplification (well-differentiated); t(12;16) FUS-DDIT3 (myxoid)."}, {"id": "RX1", "set": "DG", "stem": "You treat a patient with acute microcrystalline arthritis (gout or pseudo-gout). Which drug regimen is NOT acceptable for a positive patient outcome?", "opts": ["High doses of a short acting NSAID such as ibuprofen.", "High doses of ibuprofen plus daily allopurinol.", "Intramuscular injection of a long-acting steroid.", "Colchicine orally three to four times daily for 24 to 48 hours."], "ans": 1, "why": "The acute attack is treated with anti-inflammatory drugs: a short-acting NSAID, colchicine or a steroid. As taught here, allopurinol is not started during the attack, because a sudden change in serum urate can mobilize crystals and prolong the flare. Note: current ACR guidance (2020) allows starting urate-lowering therapy during a flare with anti-inflammatory cover, and a patient already on allopurinol should never stop it during an attack. Allopurinol does nothing for pseudogout.", "wrong": ["Acceptable: high-dose short-acting NSAIDs are first-line for an acute attack.", "", "Acceptable: steroids (IM, oral or intra-articular) treat acute attacks, especially when NSAIDs are contraindicated.", "Acceptable: colchicine used early in the attack is effective."], "pearl": "Acute gout: NSAID, colchicine or steroid. Chronic: allopurinol/febuxostat (xanthine oxidase inhibitors) after the flare, with NSAID or colchicine cover."}, {"id": "RX2", "set": "DG", "stem": "Which of the following statements does NOT accurately describe the characteristics of treatment of acute inflammation with nonsteroidal anti-inflammatory drugs (NSAIDs)?", "opts": ["Anti-inflammatory activity is maximal within 30 to 45 minutes as soon as the NSAID is absorbed.", "Blockade of prostaglandin synthesis by NSAIDs can inhibit naturally protective processes with equal potency to inhibition of inflammatory processes.", "Many NSAIDS deliver pain relief as well as anti-inflammatory activity.", "For intense, acute inflammation short-acting NSAIDs are often more effective than long-acting ones."], "ans": 0, "why": "Analgesia can start soon after absorption, but the full anti-inflammatory effect builds over a much longer period, so it is not maximal within 30–45 minutes.", "wrong": ["", "True: prostaglandins also protect the gastric mucosa and maintain renal blood flow, and NSAIDs block those as readily as they block inflammation (hence ulcers and kidney injury).", "True: most NSAIDs are analgesic and antipyretic as well as anti-inflammatory.", "True: short-acting NSAIDs are preferred for intense acute inflammation such as acute gout."], "pearl": "NSAID toxicities come from blocking protective prostaglandins: GI ulcers, ↓ renal blood flow (AKI), platelet dysfunction."}, {"id": "RX3", "set": "DG", "stem": "A 30 year-old female has rheumatoid arthritis is not responding to NSAIDs, low doses of prednisone or physical therapy for knee pain. She has very active swelling in wrists, fingers, and shoulders. Which of the following is the BEST choice of a disease-modifying drug for this patient?", "opts": ["High doses of methotrexate given intravenously.", "Antibodies to tumor necrosis factor receptor (i.e., etanercept) as a subcutaneous weekly injection.", "High doses of prednisone daily.", "Celecoxib twice daily.", "Bi-annual injections of Denosumab"], "ans": 1, "why": "Active RA that has failed NSAIDs and low-dose steroids needs a disease-modifying agent, and a TNF inhibitor such as weekly subcutaneous etanercept is the keyed best choice. (Strictly, etanercept is a soluble TNF receptor–Fc fusion protein that binds TNF, not an antibody to the receptor.) In practice methotrexate is usually started first, but it is dosed low and weekly, orally or subcutaneously, not in high IV doses.", "wrong": ["Methotrexate for RA is low-dose weekly (oral or subcutaneous); high-dose IV methotrexate is a chemotherapy regimen.", "", "High-dose daily prednisone controls symptoms but is not an acceptable disease-modifying strategy; long-term toxicity (osteoporosis, AVN, diabetes, infection) is unacceptable.", "Celecoxib is a COX-2-selective NSAID; it relieves symptoms but doesn’t modify RA.", "Denosumab (anti-RANKL) treats osteoporosis; it isn’t a DMARD for joint inflammation."], "pearl": "Etanercept = TNF receptor–Fc decoy (“-cept”); infliximab/adalimumab = anti-TNF antibodies (“-mab”). Screen for TB first."}, {"id": "RX4", "set": "DG", "stem": "Gout is a process driven by saturation of mono-sodium urate (MSU) crystals in biologic fluids, both in joints and soft tissues. Therefore, which of the following statements is FALSE?", "opts": ["MSU precipitates in less perfused, colder, tissues such as fingers, toes, and ears.", "MSU can precipitate in large amounts in all tissues, including kidneys, when large amounts of urate are produced in hypermetabolic states such as lymphoma.", "When MSU precipitates in a joint during an acute attack of gout, it is important to start a drug to decrease uric acid serum concentration quickly, i.e. give allopurinol at the first sign of an attack.", "MSU is deposited in soft tissue, collecting at finger tips, ears, and occasionally directly into bone as Tophi.", "Using short-acting anti-inflammatory therapy (eg., ibuprofen) alone until the acute painful gout attack resolves is the preferred approach before using urate lowering therapy."], "ans": 2, "why": "As taught, allopurinol is not started at the first sign of an attack: an abrupt fall in serum urate can mobilize crystals and prolong the flare. Treat the attack with anti-inflammatory therapy first, then start urate-lowering therapy. (Current ACR guidance does allow starting it during a flare with anti-inflammatory cover. Never stop allopurinol mid-flare in a patient already taking it.)", "wrong": ["True: urate is less soluble at lower temperatures, so it deposits in cool, poorly perfused acral sites.", "True: massive cell turnover (lymphoma, leukemia, tumor lysis) floods the body with urate; uric acid crystallizes in the acidic renal tubules (acute uric acid nephropathy).", "", "True: tophi are MSU deposits in soft tissue, ears, fingertips and sometimes bone.", "True: this is the preferred sequence as taught."], "pearl": "Urate solubility falls with temperature → big toe (podagra), ears, fingers. Tumor lysis → uric acid nephropathy (prevent with allopurinol/rasburicase beforehand)."}, {"id": "RX5", "set": "DG", "stem": "Which of the following statements about non-Steroidal Anti-Inflammatory Drugs (NSAIDs) is FALSE?", "opts": ["Short-acting NSAIDs (e.g., indomethacin, ibuprofen) are ideal for acute, intense inflammatory conditions.", "Newer, long-acting NSAIDs (e.g., piroxicam, meloxicam) not only improve symptoms, but also modify the outcome of the underlying disease in rheumatoid arthritis.", "NSAIDs reduce prostaglandins and cytokines within inflamed tissues, reducing pain, leaky vessels with secondary swelling, and heat.", "Cyclooxygenase-2 (COX-2), which is selectively inhibited by some NSAIDs, is found not only in inflamed tissues, but also in normal tissues such as kidney."], "ans": 1, "why": "No NSAID, short- or long-acting, modifies the course of rheumatoid arthritis. NSAIDs only relieve symptoms; joint destruction continues unless a DMARD is used.", "wrong": ["True: short-acting NSAIDs suit acute, intense inflammation.", "", "True: less prostaglandin means less pain, vascular leak (swelling) and heat.", "True: COX-2 is constitutive in the kidney, so COX-2-selective drugs still carry renal risk."], "pearl": "NSAIDs = symptom control only. DMARDs (methotrexate, biologics) change RA outcome."}, {"id": "RX6", "set": "DG", "stem": "Etanercept is a genetically engineered, injectable antibody to tumor necrosis factor-alpha (TNF-α) receptor approved for adults and children when used to treat rheumatoid arthritis and some other autoimmune diseases. The best indication for use of this medication is summarized in which statement below?", "opts": ["Any patient with inflammatory arthritis unresponsive to NSAIDs and to other disease modifying drugs such as methotrexate.", "A patient with a negative Tuberculin skin test, with no chronic sinus or pulmonary infection, with inflammatory arthritis that has not responded to methotrexate.", "A 32 year old woman with multiple sclerosis or other neurologic inflammatory disease.", "A young man with rheumatoid arthritis who has failed to respond to methotrexate and has developed a severe sinus infection while taking another anti-TNF drug (e.g., adalimumab)."], "ans": 1, "why": "TNF is central to defense against granulomatous and other infections, so anti-TNF therapy can reactivate latent TB and worsen infections. The best candidate has failed methotrexate, has a negative TB screen and no chronic infection. (Etanercept is technically a soluble TNF receptor–Fc fusion protein.)", "wrong": ["“Any patient” ignores the required screening for latent TB and active infection.", "", "TNF inhibitors can trigger or worsen demyelinating disease such as multiple sclerosis; they are contraindicated.", "A serious infection on one anti-TNF agent is a reason not to start another."], "pearl": "Before any TNF inhibitor: screen for latent TB (and hepatitis B). Avoid in active infection, demyelinating disease and severe heart failure."}, {"id": "RX20", "set": "DO", "stem": "Which of the following is NOT a role of estrogen in the bone remodeling process?", "opts": ["Promoting absorption of calcium in the intestine", "Blocking the action of vitamin D in the intestine", "Stimulating collagen synthesis", "Accelerating the death of osteoclasts"], "ans": 1, "why": "Estrogen supports vitamin D action and intestinal calcium absorption; it does not block vitamin D. Its bone-protective effects include more calcium absorption, osteoblast survival and collagen synthesis, and osteoclast apoptosis (with lower RANKL and higher OPG).", "wrong": ["True: estrogen promotes intestinal calcium absorption.", "", "True: estrogen stimulates collagen synthesis and prolongs osteoblast life.", "True: estrogen accelerates osteoclast apoptosis, reducing resorption."], "pearl": "Estrogen loss → ↑RANKL, ↓OPG, ↑IL-6 → more osteoclast activity → postmenopausal osteoporosis."}, {"id": "RX21", "set": "DO", "stem": "As a treatment for osteoporosis, parathyroid hormone (teriparatide) differs from the anti-resorptive agents in that it:", "opts": ["Is first line therapy for osteoporosis, while most of the anti-resorptive agents are not.", "Decreases apoptosis of osteoblasts.", "Can be administered in a single monthly injection.", "Increases apoptosis of osteoclasts."], "ans": 1, "why": "Teriparatide is anabolic. Given intermittently (daily injection), PTH increases osteoblast number and activity and decreases osteoblast apoptosis, so it builds new bone. Anti-resorptives work on the osteoclast side instead.", "wrong": ["Bisphosphonates, not teriparatide, are first-line; teriparatide is reserved for severe or refractory osteoporosis.", "", "Teriparatide is a daily subcutaneous injection.", "Increasing osteoclast apoptosis is how anti-resorptives (bisphosphonates, estrogen) act."], "pearl": "Intermittent PTH (teriparatide, abaloparatide) = anabolic. Continuous PTH = resorption. Daily SC injection. Osteosarcoma in rats (former boxed warning, removed 2020–21); avoid in Paget disease, prior skeletal radiation, open epiphyses."}, {"id": "RX22", "set": "DO", "stem": "Which of the following statements is FALSE regarding the pharmacological and clinical differences among the bisphosphonates?", "opts": ["All three bisphosphonates (alendronate, ibandronate, and risedronate) show similar vertebral and nonvertebral fracture risk reduction.", "In terms of fracture reduction, differences in the speed or onset of action exist between the three bisphosphonates.", "Of the three, risedronate appears to be the most potent in terms of inhibition at the key enzyme in the osteoclast.", "There are differences in the binding affinity to bone between the three bisphosphonates."], "ans": 0, "why": "All three reduce vertebral fractures, but they are not equivalent for nonvertebral fractures: alendronate and risedronate have proven hip/nonvertebral fracture reduction, while ibandronate does not.", "wrong": ["", "True: risedronate, for example, reduces fractures relatively quickly; onset differs between agents.", "True as taught: risedronate is a potent inhibitor of farnesyl pyrophosphate synthase, the target enzyme in osteoclasts.", "True: binding affinity for hydroxyapatite differs (alendronate binds strongly), which affects how long the drug stays in bone."], "pearl": "Bisphosphonates inhibit farnesyl pyrophosphate synthase in osteoclasts. Ibandronate: vertebral benefit only. Take upright with water, fasting."}, {"id": "RX23", "set": "DO", "stem": "A 48-year-old post-menopausal woman, who has been taking tamoxifen for 1½ years following the resection of an estrogen-receptor positive breast carcinoma, sustains a vertebral fracture with minimal trauma. Biopsy of the vertebral body reveals no evidence of carcinoma, and a bone scan is otherwise negative for metastatic disease. Bone densitometry reveals that the bone density in the lumbar spine and hip are reduced (T-scores of -2.6 and -2.1, respectively). Which of the following is the most appropriate course of action?", "opts": ["Discontinue the tamoxifen.", "Discontinue the tamoxifen and begin estrogen therapy.", "Begin therapy with a bisphosphonate.", "Begin therapy with calcitonin."], "ans": 2, "why": "A fragility vertebral fracture plus a T-score below −2.5 is osteoporosis needing treatment, and a bisphosphonate is first-line. Tamoxifen should continue for her breast cancer; in postmenopausal women it actually protects bone (an estrogen agonist in bone).", "wrong": ["Stopping tamoxifen would harm her cancer treatment and wouldn’t treat the osteoporosis.", "Estrogen is contraindicated after ER-positive breast cancer.", "", "Calcitonin is a weak agent with no hip-fracture benefit; it is not first-line."], "pearl": "Tamoxifen/raloxifene (SERMs): estrogen agonist in bone, antagonist in breast. Fragility fracture or T ≤ −2.5 → treat; bisphosphonate first-line."}, {"id": "RX42", "set": "DO", "stem": "Which pharmacologic therapies are indicated for the treatment of postmenopausal osteoporosis in women as well as the treatment of osteoporosis in men?", "opts": ["Raloxifene, alendronate, and risedronate", "Alendronate, risedronate, and ibandronate", "Teriparatide (PTH 1-34), alendronate, and risedronate", "Calcitonin, alendronate, and risedronate"], "ans": 2, "why": "Teriparatide, alendronate and risedronate are approved for osteoporosis in both postmenopausal women and men (as are zoledronic acid and denosumab). The distractors each include a drug approved only for postmenopausal women.", "wrong": ["Raloxifene is a SERM approved only for postmenopausal women.", "Ibandronate is approved only for postmenopausal women.", "", "Calcitonin is approved only for postmenopausal osteoporosis."], "pearl": "Approved in men too: alendronate, risedronate, zoledronic acid, teriparatide, abaloparatide, denosumab. Women only: raloxifene, ibandronate, calcitonin, estrogen."}, {"id": "RX43", "set": "DO", "stem": "The role of estrogen in the bone remodeling process, and therefore in the prevention of osteoporosis, includes all of the following EXCEPT:", "opts": ["Promoting absorption of calcium in the intestine", "Blocking the action of vitamin D", "Prolonging the life of osteoblasts and stimulating collagen synthesis", "Inhibiting osteoclast activity, thereby reducing bone resorption"], "ans": 1, "why": "Estrogen enhances, rather than blocks, vitamin D action and calcium absorption. Its other effects all protect bone: more calcium absorption, longer osteoblast life with more collagen, and less osteoclast activity.", "wrong": ["True: estrogen promotes intestinal calcium absorption.", "", "True: estrogen prolongs osteoblast life and stimulates collagen synthesis.", "True: estrogen inhibits osteoclasts (and promotes their apoptosis)."], "pearl": "Same concept as the earlier estrogen question: estrogen never blocks vitamin D."}, {"id": "RX44", "set": "DO", "stem": "A 47 year-old post-menopausal woman, who has been taking tamoxifen for the past 1½ years following the resection of a breast cancer, sustains a vertebral fracture with minimal trauma. Biopsy of the vertebral body reveals no evidence of cancer and a bone scan is otherwise negative for metastasis. Bone densitometry shows osteoporosis with a lumbar spine T-score of -2.7. Which of the following is the most appropriate course of action for this patient?", "opts": ["Discontinue the tamoxifen", "Begin therapy with calcitonin", "Discontinue the tamoxifen and begin therapy with raloxifene", "Begin therapy with a bisphosphonate"], "ans": 3, "why": "Osteoporosis with a fragility fracture is treated with a bisphosphonate, first-line. Tamoxifen continues for the breast cancer and is bone-protective after menopause.", "wrong": ["Stopping tamoxifen undermines cancer treatment and doesn’t treat the osteoporosis.", "Calcitonin is weak and lacks hip-fracture data.", "Raloxifene isn’t a substitute for adjuvant tamoxifen here, and it is a weaker osteoporosis agent than a bisphosphonate.", ""], "pearl": "Fragility fracture on tamoxifen → keep tamoxifen, add a bisphosphonate."}, {"id": "RX45", "set": "DO", "stem": "Ms. R. is a 60 year-old woman who consults her physician because her mother has osteoporosis and has just fractured two vertebrae. Ms. R. has a history of high cholesterol. She does not smoke and drinks an occasional glass of wine. She takes no medications and has previously refused estrogen therapy because her sister has breast cancer. Physical examination reveals a thin, healthy-appearing woman. When her bone density is measured, her lowest T-score is -2.2, consistent with a diagnosis of low bone mass or osteopenia. Which of the following medications is most appropriate for this patient?", "opts": ["Teriparatide (PTH 1-34)", "Risedronate", "Calcitonin", "Raloxifene", "Either B or D is appropriate"], "ans": 4, "why": "Osteopenia with risk factors (thin, family history of fracture) can be treated preventively with a bisphosphonate such as risedronate or with raloxifene. Raloxifene is attractive here because it also lowers breast cancer risk (her sister has breast cancer) and lowers LDL. (This combined-answer format is retired but still useful for review.)", "wrong": ["Teriparatide is reserved for severe osteoporosis, not osteopenia.", "Appropriate, but not the only appropriate choice.", "Calcitonin is weak and not preferred for prevention.", "Appropriate, but not the only appropriate choice.", ""], "pearl": "Raloxifene: bone + breast cancer prevention + ↓LDL; risks = VTE, hot flashes."}, {"id": "RX20a", "set": "DO", "stem": "A 53 year old woman presents on the advice of her orthopedist after sustaining a low-trauma fracture of the forearm when she slipped on a wet floor at work. She started hormone replacement therapy at age 49 years for hot flushes, but stopped after 6 months of therapy because she decided “not to interfere with nature.” She has a history of hypothyroidism treated with levothyroxine and supplements her diet with calcium. She runs 4 days a week, does not smoke cigarettes, and only occasionally drinks alcohol. She is 5'6\" and weighs 140 pounds. DXA (bone density) scan shows the following T-scores: lumbar spine T-score = -2.6, left hip T-score = -1.7, left femoral neck T-score = -1.9. Which of the following is the best approach to treatment for this patient?", "opts": ["Advise her to add vitamin D 1000 IU daily to her calcium supplements only.", "Prescribe estrogen/progesterone combination therapy.", "Prescribe calcitonin.", "Prescribe risedronate.", "Prescribe raloxifene."], "ans": 3, "why": "A low-trauma forearm fracture plus a spine T-score of −2.6 means osteoporosis that needs pharmacologic treatment. A bisphosphonate such as risedronate, with proven vertebral and nonvertebral fracture reduction, is the best first choice.", "wrong": ["Calcium and vitamin D are needed but are not enough after a fragility fracture.", "She declined HRT before, and estrogen isn’t first-line for osteoporosis because of its risks.", "Calcitonin is weak, with no nonvertebral fracture benefit.", "", "Raloxifene reduces vertebral but not nonvertebral fractures, and she has just had a nonvertebral (wrist) fracture."], "pearl": "Fragility fracture + osteoporosis → bisphosphonate (alendronate, risedronate). Always add calcium + vitamin D."}, {"id": "RX21a", "set": "DO", "stem": "Which one of the following statements regarding the currently available FDA-approved medications for osteoporosis is true?", "opts": ["Both raloxifene and calcitonin have been shown to reduce the risk of hip fracture.", "Bisphosphonates have the most robust fracture reduction data and are the most potent oral anti-resorptive agents available for the prevention and treatment of osteoporosis.", "Estrogen therapy was shown to have anti-fracture efficacy in the Women's Health Initiative trial and is therefore now approved by the FDA as first line therapy for the treatment of postmenopausal osteoporosis.", "Bisphosphonates have been shown to decrease the incidence of vertebral fractures but not hip fractures."], "ans": 1, "why": "Bisphosphonates have the strongest fracture-reduction evidence (vertebral and, for alendronate, risedronate and zoledronic acid, hip) and are the most potent oral anti-resorptives.", "wrong": ["Neither raloxifene nor calcitonin has shown hip-fracture reduction.", "", "The WHI did show fewer fractures with estrogen, but estrogen is FDA-approved only for prevention (not treatment) of postmenopausal osteoporosis, and its cardiovascular, VTE and breast cancer risks keep it from being first-line.", "Alendronate, risedronate and zoledronic acid do reduce hip fractures."], "pearl": "Hip-fracture benefit: alendronate, risedronate, zoledronic acid, denosumab. Not: raloxifene, calcitonin, ibandronate."}, {"id": "RX22a", "set": "DO", "stem": "You are asked to see a 72 year old man in consultation for possible treatment for osteoporosis. He is generally healthy, but has a history of amyloidosis with gut infiltration and resulting esophageal achalasia/dysphagia and diarrhea. His DXA (bone density) scan shows the following results: lumbar spine T-score = -3.5, left hip T-score = -3.1, left femoral neck T-score = -3.9. Which of the following is the best treatment option for this patient?", "opts": ["Alendronate", "Intravenous ibandronate", "Teriparatide", "Testosterone"], "ans": 2, "why": "Severe osteoporosis (T-scores around −3.5) in a man who can’t take oral bisphosphonates (achalasia, dysphagia, malabsorption) is best treated with teriparatide, an injectable anabolic agent approved in men.", "wrong": ["Oral alendronate is contraindicated with esophageal disorders such as achalasia, and absorption is poor with diarrhea.", "IV ibandronate avoids the gut, but ibandronate is approved only for postmenopausal women and lacks hip-fracture data.", "", "Testosterone helps only men with documented hypogonadism; it isn’t a primary osteoporosis treatment."], "pearl": "Oral bisphosphonate contraindications: esophageal disorders, inability to stay upright 30 minutes, low CrCl. Severe osteoporosis → anabolic (teriparatide)."}, {"id": "RX23a", "set": "DO", "stem": "Mrs. G. is a 55 year old woman who consults her physician because her mother, who has osteoporosis, has just fractured her hip. Mrs. G's past medical history is significant for menopause at age 51, high cholesterol with a total cholesterol of 247 mg/dl and an LDL of 152 mg/dl, a DVT (deep venous thrombosis) at age 49, and a previous breast biopsy showing atypical ductal hyperplasia. DXA (bone density) scan reveals a lumbar spine T-score = -2.2, left hip T-score = -1.3, femoral neck T-score = -1.8. She is interested in preventive therapy and has been reading about the risks and benefits of raloxifene. Which of the following factors in her history is a contraindication to the use of raloxifene?", "opts": ["Atypical ductal hyperplasia", "DVT", "High cholesterol and possible underlying cardiovascular disease", "There are no contraindications to the use of raloxifene in this patient."], "ans": 1, "why": "Raloxifene raises the risk of venous thromboembolism, so a prior DVT is a contraindication.", "wrong": ["Atypical ductal hyperplasia raises breast cancer risk, which is a reason to favor raloxifene, since it reduces invasive breast cancer.", "", "Raloxifene lowers LDL; high cholesterol isn’t a contraindication (though it doesn’t reduce cardiac events).", "Her prior DVT is a contraindication."], "pearl": "Raloxifene contraindication: history of VTE. Side effects: hot flashes, leg cramps, ↑ stroke death risk."}];

</script>
<script>
(function(){
const app=document.getElementById('app');
const byId=Object.fromEntries(Q.map(q=>[q.id,q]));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S; let tick=null;

function fresh(){return{phase:'setup',names:['Player 1','Player 2'],sets:Object.fromEntries(Object.keys(SETS).map(k=>[k,true])),
  mode:'turns',timer:60,shuffle:true,len:20};}

function counts(){const c={},im={};Q.forEach(q=>{c[q.set]=(c[q.set]||0)+1;if(q.img)im[q.set]=(im[q.set]||0)+1;});c.im=im;return c;}

/* ---------------- setup ---------------- */
function renderSetup(){
  stopTimer();
  const c=counts();
  const n=Q.filter(q=>S.sets[q.set]).length;
  app.innerHTML=`
  <section class="setup">
    <div class="hero">
      <div class="tag">MSK Pathology &amp; Pharmacology · two-player duel</div>
      <h1>Ring the bell.<span>Make the call.</span></h1>
      <p>${Q.length} Step 1-style questions — metabolic bone disease, fractures and joints, bone tumors and soft-tissue tumors, plus gout, NSAIDs, DMARDs and osteoporosis drugs — played head-to-head on one screen. Pass the laptop or sit side by side; each station gets its own bell.</p>
      <ul class="rules">
        <li><b>+100</b><span>Correct on your station.</span></li>
        <li><b>+0–50</b><span>Speed bonus — the more bell left, the bigger it is.</span></li>
        <li><b>+50</b><span>Steal: your opponent missed and you get one shot with their pick crossed out.</span></li>
        <li><b>+25</b><span>Streak bonus from your third straight first-try correct.</span></li>
      </ul>
    </div>
    <div class="form">
      <div class="fl"><span class="lab">Players</span>
        <div class="names">
          <input id="p1name" aria-label="Player 1 name" value="${esc(S.names[0])}" maxlength="18">
          <input id="p2name" aria-label="Player 2 name" value="${esc(S.names[1])}" maxlength="18">
        </div>
      </div>
      <div class="fl"><span class="lab">Question sets</span>
        <div class="seg" id="grp"><button data-g="all">All</button><button data-g="P">Pathology only</button><button data-g="D">Pharmacology only</button></div>
        <div class="checks">
          ${Object.entries(SETS).map(([k,v])=>`<label class="chk"><input type="checkbox" id="set-${k}" data-set="${k}" ${S.sets[k]?'checked':''}><span>${esc(v)}</span><em>${c[k]} Qs${c.im[k]?` · ${c.im[k]} image${c.im[k]>1?'s':''}`:''}</em></label>`).join('')}
        </div>
      </div>
      <div class="fl"><span class="lab">Mode</span>
        <div class="seg" id="mode">
          <button data-v="turns" aria-pressed="${S.mode==='turns'}">Alternate turns</button>
          <button data-v="buzz" aria-pressed="${S.mode==='buzz'}">Buzzer race</button>
        </div>
        <p class="hint">${S.mode==='turns'?'Stations alternate between players. A miss opens a steal for the other player.':'Both players read. First to buzz answers — <kbd>Q</kbd> for player 1, <kbd>P</kbd> for player 2, or tap your button. A miss hands the station to the other player.'}</p>
      </div>
      <div class="fl"><span class="lab">Bell per station</span>
        <div class="seg" id="timer">
          ${[[0,'Off'],[45,'45 s'],[60,'60 s'],[90,'90 s']].map(([v,l])=>`<button data-v="${v}" aria-pressed="${S.timer===v}">${l}</button>`).join('')}
        </div>
      </div>
      <div class="fl"><span class="lab">Stations per game</span>
        <div class="seg" id="len">
          ${[[10,'10'],[20,'20'],[40,'40'],[0,'All']].map(([v,l])=>`<button data-v="${v}" aria-pressed="${S.len===v}">${l}</button>`).join('')}
        </div>
        <p class="hint">Drawn at random from the sets you picked${S.shuffle?'':' (in order, from the top)'}.</p>
      </div>
      <label class="chk"><input type="checkbox" id="shuffle" ${S.shuffle?'checked':''}><span>Shuffle station order</span></label>
      <button class="go" id="start" ${n<2?'disabled':''}>Start · ${S.len&&S.len<n?S.len:n} stations</button>
    </div>
  </section>`;
  const saveNames=()=>{S.names=[document.getElementById('p1name').value.trim()||'Player 1',document.getElementById('p2name').value.trim()||'Player 2'];};
  app.querySelectorAll('[data-set]').forEach(el=>el.onchange=()=>{saveNames();S.sets[el.dataset.set]=el.checked;renderSetup();});
  app.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{saveNames();S.mode=b.dataset.v;renderSetup();});
  app.querySelectorAll('#timer button').forEach(b=>b.onclick=()=>{saveNames();S.timer=+b.dataset.v;renderSetup();});
  app.querySelectorAll('#len button').forEach(b=>b.onclick=()=>{saveNames();S.len=+b.dataset.v;renderSetup();});
  app.querySelectorAll('#grp button').forEach(b=>b.onclick=()=>{saveNames();const g=b.dataset.g;Object.keys(SETS).forEach(k=>S.sets[k]=g==='all'||k[0]===g);renderSetup();});
  const sh=document.getElementById('shuffle');sh.onchange=()=>{S.shuffle=sh.checked;};
  document.getElementById('start').onclick=()=>{saveNames();begin();};
}

function begin(){
  let deck=Q.filter(q=>S.sets[q.set]).map(q=>q.id);
  if(S.shuffle){for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}}
  if(S.len&&S.len<deck.length) deck=deck.slice(0,S.len);
  Object.assign(S,{phase:'play',deck,idx:0,
    players:[0,1].map(()=>({score:0,right:0,steals:0,streak:0,best:0,bySet:{},missed:[]})),
    firstTurn:0});
  startStation();
}

/* ---------------- play ---------------- */
function startStation(){
  const q=byId[S.deck[S.idx]];
  S.st={sub:S.mode==='buzz'?'buzz':'answer',active:S.mode==='turns'?(S.idx%2):null,out:[],picked:null,
        result:null,gain:0,who:null,deadline:S.timer?Date.now()+S.timer*1000:0};
  render();startTimer();
}
function startTimer(){
  stopTimer(); if(!S.timer)return;
  tick=setInterval(()=>{
    const st=S.st; if(!st||st.sub==='reveal'){stopTimer();return;}
    const left=st.deadline-Date.now();
    paintBell();
    if(left<=0) timeout();
  },250);
}
function stopTimer(){if(tick){clearInterval(tick);tick=null;}}
function paintBell(){
  const bar=document.querySelector('.bell'); if(!bar||!S.timer)return;
  const left=Math.max(0,S.st.deadline-Date.now());
  bar.firstElementChild.style.transform=`scaleX(${left/(S.timer*1000)})`;
  bar.classList.toggle('warn',left<10000);
  const t=document.getElementById('secs'); if(t) t.textContent=Math.ceil(left/1000)+' s';
}
function timeout(){
  const st=S.st;
  if(st.sub==='answer'){ record(st.active,false); openSteal(1-st.active,'Bell rang'); }
  else { if(st.sub==='steal') record(st.active,false,true); reveal(null,'Bell rang — nobody scores.'); }
}
function openSteal(p,why){
  const st=S.st; st.sub='steal'; st.active=p; st.why=why;
  st.deadline=S.timer?Date.now()+Math.max(15,Math.round(S.timer/3))*1000:0;
  render(); startTimer();
}
function buzz(p){ if(S.st.sub!=='buzz')return; S.st.sub='answer'; S.st.active=p; render(); }

function record(p,ok,steal){
  const q=byId[S.deck[S.idx]], P=S.players[p];
  const b=P.bySet[q.set]||(P.bySet[q.set]={right:0,seen:0});
  if(!steal) b.seen++;
  if(ok){ if(!steal) b.right++; }
  else if(!P.missed.includes(q.id)) P.missed.push(q.id);
}

function choose(i){
  const st=S.st, q=byId[S.deck[S.idx]];
  if(!(st.sub==='answer'||st.sub==='steal')||st.out.includes(i))return;
  const p=st.active, P=S.players[p], ok=q.acc?q.acc.includes(i):i===q.ans;
  if(st.sub==='answer'){
    if(ok){
      let g=100; const bonus=S.timer?Math.round(50*Math.max(0,st.deadline-Date.now())/(S.timer*1000)):0; g+=bonus;
      P.streak++; P.best=Math.max(P.best,P.streak); if(P.streak>=3) g+=25;
      P.right++; P.score+=g; record(p,true);
      if(S.mode==='buzz') S.players[1-p].streak=0;
      st.who=p; st.gain=g; st.picked=i;
      reveal(true,`${S.names[p]} +${g}${bonus?` (incl. +${bonus} speed)`:''}${P.streak>=3?` · streak ×${P.streak}`:''}`);
    }else{
      P.streak=0; record(p,false); st.out.push(i); st.firstWrong=i;
      openSteal(1-p,`${S.names[p]} picked ${LET[i]}`);
    }
  }else{
    st.picked=i;
    if(ok){ P.score+=50; P.steals++; st.who=p; st.gain=50; record(p,true,true); reveal(true,`${S.names[p]} steals +50`); }
    else { record(p,false,true); st.out.push(i); reveal(false,'Steal missed — nobody scores.'); }
  }
}
function reveal(ok,msg){ stopTimer(); const st=S.st; st.sub='reveal'; st.result=ok; st.msg=msg; render(); }
function next(){ S.idx++; if(S.idx>=S.deck.length){S.phase='end';render();} else startStation(); window.scrollTo({top:0}); }

function boardHTML(){
  const st=S.st, P=S.players;
  const pl=k=>`<div class="pl p${k+1} ${st&&st.active===k&&st.sub!=='reveal'?'on':''}">
    <div><div class="nm">${esc(S.names[k])}</div><div class="meta">${P[k].right} first-try · ${P[k].steals} steals${P[k].streak>=2?` · streak ${P[k].streak}`:''}</div></div>
    ${S.mode==='buzz'?`<span class="key">${k?'P':'Q'}</span>`:''}
    <div class="sc" id="sc${k}">${P[k].score}</div></div>`;
  return `<div class="board">${pl(0)}
    <div class="mid"><span class="tag">Station</span><span class="st">${S.idx+1}<span class="tag"> / ${S.deck.length}</span></span><span class="tag" id="secs">${S.timer?'':'no bell'}</span></div>
    ${pl(1)}</div>
    ${S.timer?'<div class="bell"><i></i></div>':''}`;
}

function renderPlay(){
  const q=byId[S.deck[S.idx]], st=S.st, rev=st.sub==='reveal';
  let chip='';
  if(st.sub==='buzz') chip=`<span class="chip">Buzz in to answer</span>`;
  else if(st.sub==='answer') chip=`<span class="chip p${st.active+1}">${esc(S.names[st.active])} answering</span>`;
  else if(st.sub==='steal') chip=`<span class="chip p${st.active+1}">${esc(S.names[st.active])} · steal for +50</span><span class="chip steal">${esc(st.why)}</span>`;
  const optCls=i=>{
    if(rev){ if(i===q.ans||(q.acc&&q.acc.includes(i))) return 'right'; if(st.out.includes(i)||i===st.picked) return 'wrong'; return ''; }
    return st.out.includes(i)?'out':'';
  };
  const dis=rev||st.sub==='buzz';
  const answerBlock=rev?`
    <div class="verdict ${st.result?'good':'bad'}">
      <h3>${st.result?'Correct':'Answer: '+LET[q.ans]}</h3>
      <div class="tag">${esc(st.msg)}</div>
      <p><b>${LET[q.ans]}. ${esc(q.opts[q.ans])}</b> — ${esc(q.why)}</p>
      <ul class="why-list">${q.wrong.map((w,i)=>w?`<li><b>${LET[i]}</b>${esc(w)}</li>`:'').join('')}</ul>
    </div>
    <div class="hy"><b>High-yield pearl</b>${esc(q.pearl)}</div>
    <div class="actions"><button class="btn" id="next">${S.idx+1>=S.deck.length?'See final scores':'Next station'}</button><kbd>Enter</kbd>
      <button class="btn ghost" id="quit">End game</button></div>`
    : st.sub==='buzz'?`<div class="buzz"><button class="b1" id="bz0">${esc(S.names[0])}<small>buzz · Q</small></button><button class="b2" id="bz1">${esc(S.names[1])}<small>buzz · P</small></button></div>`
    : `<div class="actions"><span class="hint">Tap an option or press <kbd>1</kbd>–<kbd>${q.opts.length}</kbd></span><button class="btn ghost" id="quit">End game</button></div>`;
  app.innerHTML=`<section style="display:flex;flex-direction:column;gap:14px">
    ${boardHTML()}
    <div class="station ${q.img?'':'noimg'}">
      ${q.img?`<figure class="plate" style="margin:0"><button class="zbtn" data-z="${q.img}" aria-label="Enlarge image"><img src="${IMGS[q.img]}" alt="${esc(q.cap)} for ${esc(SETS[q.set])} question"></button><figcaption class="cap"><span>${esc(SETS[q.set])}</span><span>${esc(q.cap)}</span></figcaption></figure>`:''}
      <div class="qcol">
        <div class="status">${chip}<span class="tag">${esc(SETS[q.set])}</span></div>
        <p class="stem">${esc(q.stem)}</p>
        <div class="opts">${q.opts.map((o,i)=>`<button class="opt ${optCls(i)}" data-i="${i}" ${dis||st.out.includes(i)?'disabled':''}><span class="lt">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        ${answerBlock}
      </div>
    </div></section>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  const n=document.getElementById('next'); if(n){n.onclick=next; n.focus({preventScroll:true});}
  const qt=document.getElementById('quit'); if(qt) qt.onclick=()=>{stopTimer();S.phase='end';render();};
  [0,1].forEach(k=>{const b=document.getElementById('bz'+k); if(b) b.onclick=()=>buzz(k);});
  app.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>zoom(b.dataset.z));
  if(rev&&st.who!=null){const e=document.getElementById('sc'+st.who); e&&e.classList.add('pop');}
  paintBell();
}

/* ---------------- results ---------------- */
function renderEnd(){
  stopTimer();
  const P=S.players, [a,b]=[P[0].score,P[1].score];
  const head=a===b?`Dead heat at <span class="w1">${a}</span>`:`<span class="w${a>b?1:2}">${esc(S.names[a>b?0:1])}</span> takes the duel`;
  const played=Math.min(S.deck.length,S.idx+(S.st&&S.st.sub==='reveal'?1:0));
  const card=k=>{
    const p=P[k];
    const rows=Object.keys(SETS).filter(s=>p.bySet[s]).map(s=>`<tr><td>${esc(SETS[s])}</td><td class="n">${p.bySet[s].right} / ${p.bySet[s].seen}</td></tr>`).join('');
    return `<div class="card ${k?'c2':''}">
      <div class="tag">${esc(S.names[k])}</div>
      <div class="big">${p.score}</div>
      <div class="tag">${p.right} first-try correct · ${p.steals} steals · best streak ${p.best}</div>
      ${rows?`<div style="overflow-x:auto"><table><thead><tr><th>Own stations</th><th class="n">Correct</th></tr></thead><tbody>${rows}</tbody></table></div>`:''}
      <div class="lab tag">Review list (${p.missed.length})</div>
      ${p.missed.length?`<ul class="missed">${p.missed.map(id=>{const q=byId[id];return `<li><span>${esc(SETS[q.set])}</span>${esc(q.opts[q.ans])} — ${esc(q.pearl)}</li>`}).join('')}</ul>`:'<p class="hint">Nothing missed. Clean run.</p>'}
    </div>`;
  };
  app.innerHTML=`<section class="res">
    <div><div class="tag">Final · ${played} of ${S.deck.length} stations played</div><h2>${head}</h2></div>
    <div class="cards">${card(0)}${card(1)}</div>
    <div class="actions"><button class="btn" id="again">Rematch · same settings</button><button class="btn ghost" id="setup">Change settings</button></div>
  </section>`;
  document.getElementById('again').onclick=begin;
  document.getElementById('setup').onclick=()=>{S.phase='setup';render();};
}

function zoom(k){const d=document.createElement('div');d.className='zoom';d.innerHTML=`<img src="${IMGS[k]}" alt=""><span>Tap or press Esc to close</span>`;const close=()=>{d.remove();document.removeEventListener('keydown',esc2,true);};const esc2=e=>{if(e.key==='Escape'){e.stopPropagation();close();}};d.onclick=close;document.addEventListener('keydown',esc2,true);document.body.appendChild(d);}
function render(){ if(S.phase==='setup')renderSetup(); else if(S.phase==='play')renderPlay(); else renderEnd(); }

document.addEventListener('keydown',e=>{
  if(!S||S.phase!=='play'||e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey)return;
  const st=S.st, k=e.key.toLowerCase();
  if(st.sub==='buzz'){ if(k==='q')buzz(0); else if(k==='p')buzz(1); return; }
  if(st.sub==='reveal'){ if(k==='enter'&&document.activeElement.id!=='quit'){e.preventDefault();next();} return; }
  if(document.querySelector('.zoom'))return;
  const n='123456'.indexOf(k); const l='abcdef'.indexOf(k);
  const i=n>=0?n:l; const q=byId[S.deck[S.idx]]; if(i>=0&&i<q.opts.length){e.preventDefault();choose(i);}
});

function boot(data){
  S=(data&&data.S)||fresh();
  if(S.phase==='play'&&S.st&&S.st.sub!=='reveal'&&S.timer) S.st.deadline=Date.now()+S.timer*1000;
  render(); if(S.phase==='play') startTimer();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
</body></html>
