<title>Pharmomon · MSK Pharmacology</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Press+Start+2P&display=swap">
<style>
/* Single deliberate look: a handheld console. Painted explicitly so it holds on light or dark hosts. */
:root{
  color-scheme: dark;
  --shell:#1E2440; --shell2:#262E52; --shell-line:#3A4470; --shell-ink:#E9ECF7; --shell-mute:#A3AACB;
  --screen:#F3F7EE; --ink:#1B2033; --mute:#5B6280; --line:#1B2033;
  --sky:#D6ECDF; --sky2:#BFE0CE; --grass:#8CC06A; --grass2:#6FA553; --pad:#B9D89A; --pad2:#9BC47C;
  --gold:#E3AE12; --gold-ink:#7A5B00;
  --good:#1E8A57; --good-soft:#DCF2E6; --bad:#C2412F; --bad-soft:#F8E1DC; --trap:#96313B; --trap-soft:#F8E8E9;
  --hp-hi:#38B26A; --hp-mid:#E3AE12; --hp-lo:#D9442F; --xp:#3E8FE0;
  --hy-bg:#FFF4C2; --hy-line:#D4A300; --hy-ink:#4A3A00;
  --pixel:"Press Start 2P","Courier New",monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--shell);color:var(--shell-ink)}
body{font:15px/1.55 var(--body);margin:0;padding-inline:16px;padding-block:14px 40px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.px{font-family:var(--pixel);letter-spacing:.02em}
.mast{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--pixel);font-size:11px;color:var(--shell-mute);line-height:1.8}
.brand b{color:var(--gold)}
.brand a{color:var(--shell-mute)}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.hbtn{background:var(--shell2);border:2px solid var(--shell-line);border-radius:6px;padding:7px 10px;font-family:var(--pixel);font-size:9px;color:var(--shell-ink);line-height:1.4}
.hbtn:hover{border-color:var(--gold)}
.hbtn b{color:var(--gold)}
.screen{background:var(--screen);color:var(--ink);border:4px solid #0F1326;border-radius:14px;box-shadow:0 0 0 4px var(--shell-line),0 16px 40px #0008;overflow:hidden}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--pixel);font-size:8.5px;color:var(--shell-mute);line-height:1.8}

/* ---------- generic in-screen UI ---------- */
.pane{padding:18px;display:flex;flex-direction:column;gap:14px}
.h1{font-family:var(--pixel);font-size:clamp(18px,4vw,28px);line-height:1.3;margin:0;text-wrap:balance}
.h2{font-family:var(--pixel);font-size:13px;line-height:1.5;margin:0}
.lede{margin:0;color:var(--mute);max-width:62ch}
.box{border:3px solid var(--line);border-radius:8px;background:#fff;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px #C9CFE0;padding:14px 16px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:11px 16px;font-family:var(--pixel);font-size:10px;line-height:1.4;box-shadow:0 3px 0 #000}
.btn:hover{background:#2E3659}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn.gold{background:var(--gold);color:#241A00}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink),0 3px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tchip{display:inline-block;font-family:var(--pixel);font-size:8px;line-height:1;padding:4px 6px;border-radius:3px;color:#fff;vertical-align:middle}
.small{font-size:13px;color:var(--mute)}
.hy{background:var(--hy-bg);border:2px solid var(--hy-line);border-radius:6px;padding:10px 12px;color:var(--hy-ink);font-size:14px}
.hy b{display:block;font-family:var(--pixel);font-size:8.5px;letter-spacing:.04em;margin-bottom:6px}
.trapbox{background:var(--trap-soft);border:2px solid var(--trap);border-radius:6px;padding:10px 12px;font-size:14px;color:#4A1419}
.trapbox b.lab{display:block;font-family:var(--pixel);font-size:8.5px;color:var(--trap);margin-bottom:6px}

/* ---------- title ---------- */
.title{background:linear-gradient(180deg,var(--sky) 0 58%,var(--grass) 58% 100%);position:relative}
.title .pane{gap:16px}
.logo{font-family:var(--pixel);font-size:clamp(26px,7vw,52px);line-height:1.05;color:var(--ink);text-shadow:3px 3px 0 var(--gold);margin:0}
.logo small{display:block;font-size:.3em;margin-top:10px;text-shadow:none;color:var(--mute)}
.starters{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.starter{background:#fff;border:3px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left}
.starter:hover,.starter[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.starter .spr{width:96px;height:108px;align-self:center}
.starter h3{font-family:var(--pixel);font-size:11px;margin:0}
.starter p{margin:0;font-size:13px;color:var(--mute)}
.namefield{display:flex;flex-direction:column;gap:6px;max-width:320px}
.namefield label{font-family:var(--pixel);font-size:9px}
.namefield input{font:inherit;border:3px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink)}

/* ---------- map ---------- */
.map{position:relative;aspect-ratio:100/62;max-width:100%;background:
  radial-gradient(circle at 20% 30%,#9ACB76 0 6%,transparent 6.5%),
  radial-gradient(circle at 70% 80%,#9ACB76 0 5%,transparent 5.5%),
  repeating-linear-gradient(0deg,transparent 0 11px,#0000000a 11px 12px),
  repeating-linear-gradient(90deg,transparent 0 11px,#0000000a 11px 12px),var(--grass);
  border-bottom:4px solid var(--line)}
.map svg.paths{position:absolute;inset:0;width:100%;height:100%}
.pond{position:absolute;left:66%;top:6%;width:14%;height:20%;background:#6FB6DC;border:3px solid #3E7FA6;border-radius:48% 52% 45% 55%}
.tree{position:absolute;width:3.2%;aspect-ratio:1;background:#3F7F3A;border:2px solid #1F4A22;border-radius:50% 50% 45% 45%}
.loc{position:absolute;transform:translate(-50%,-60%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0}
.loc .ico{width:clamp(38px,8vw,64px);aspect-ratio:1}
.loc .lbl{font-family:var(--pixel);font-size:clamp(6.5px,1.4vw,9px);background:#fff;border:2px solid var(--line);border-radius:4px;padding:3px 5px;white-space:nowrap;line-height:1.3}
.loc .lbl em{display:block;font-style:normal;color:var(--mute);font-size:.85em}
.loc[disabled]{cursor:not-allowed;filter:grayscale(.9);opacity:.75}
.loc:hover .lbl{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.avatar{position:absolute;width:clamp(20px,4vw,34px);transform:translate(-50%,-100%);transition:left .55s steps(6),top .55s steps(6);pointer-events:none;z-index:3}
@media (max-width:600px){.map{aspect-ratio:100/100}}
.mapfoot{padding:14px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{border:2px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff}
.stat .k{font-family:var(--pixel);font-size:8px;color:var(--mute)}
.stat .v{font-family:var(--mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.badges{display:flex;gap:6px;margin-top:4px}
.badge{width:22px;height:22px}

/* ---------- route ---------- */
.patches{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.patch{text-align:left;background:
  repeating-linear-gradient(135deg,var(--grass) 0 6px,var(--grass2) 6px 8px);border:3px solid var(--line);border-radius:10px;padding:0;overflow:hidden;display:flex;flex-direction:column}
.patch .in{background:#fff;margin-top:26px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--line);flex:1}
.patch h3{margin:0;font-size:15px;font-weight:600}
.patch:hover{box-shadow:0 0 0 3px var(--gold)}
.meter{height:8px;border:2px solid var(--line);border-radius:4px;background:#E8ECF4;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.gymcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border:3px solid var(--line);border-radius:10px;padding:14px;background:#fff}
.gymcard .trn{width:64px;height:88px}
@media (max-width:520px){.gymcard{grid-template-columns:1fr}.gymcard .trn{justify-self:center}}

/* ---------- battle ---------- */
.scene{position:relative;aspect-ratio:16/9;max-width:100%;background:linear-gradient(180deg,var(--sky) 0 52%,var(--sky2) 52% 60%,var(--grass) 60% 100%);overflow:hidden;border-bottom:4px solid var(--line)}
.scene.gym{background:linear-gradient(180deg,#E6E1F4 0 52%,#CFC6EA 52% 60%,#B7A9DE 60% 100%)}
.scene.cave{background:linear-gradient(180deg,#D9D2C6 0 52%,#C3B8A6 52% 60%,#A8987F 60% 100%)}
.plat{position:absolute;border-radius:50%;background:var(--pad);border:3px solid var(--pad2)}
.plat.e{right:6%;top:40%;width:34%;height:13%}
.plat.p{left:4%;bottom:4%;width:40%;height:15%}
.scene.gym .plat,.scene.cave .plat{background:#fff8;border-color:#0002}
.mon{position:absolute;image-rendering:pixelated}
.mon.e{right:12%;top:8%;width:22%;aspect-ratio:16/18}
.mon.p{left:9%;bottom:8%;width:28%;aspect-ratio:16/18}
.mon.e.enter{animation:slideE .7s steps(8) both}
.mon.p.enter{animation:slideP .6s steps(8) both}
@keyframes slideE{from{transform:translateX(160%)}to{transform:none}}
@keyframes slideP{from{transform:translateX(-160%)}to{transform:none}}
.mon.hit{animation:blink .5s steps(2) 2}
@keyframes blink{50%{opacity:.1}}
.mon.e.leave{animation:slideOut .5s steps(6) forwards}
.mon.faint{animation:faint .6s ease-in forwards}
@keyframes faint{to{transform:translateY(60%);opacity:0}}
.mon.lunge.p{animation:lungeP .35s ease-out}
.mon.lunge.e{animation:lungeE .35s ease-out}
@keyframes lungeP{50%{transform:translate(18%,-10%)}}
@keyframes lungeE{50%{transform:translate(-18%,10%)}}
.scene.shake{animation:shake .35s steps(4)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.orb{position:absolute;width:7%;aspect-ratio:1;left:30%;bottom:30%;z-index:4;animation:throw .7s ease-out forwards}
@keyframes throw{to{left:73%;bottom:62%}}
.orb.wobble{left:73%;bottom:62%;animation:wob .5s ease-in-out 3}
@keyframes wob{25%{transform:rotate(-20deg)}75%{transform:rotate(20deg)}}
.stbox{position:absolute;background:#fff;border:3px solid var(--line);border-radius:8px 8px 8px 0;padding:6px 9px;min-width:0;width:44%;box-shadow:4px 4px 0 #0002}
.stbox.e{left:3%;top:5%}
.stbox.p{right:3%;bottom:6%;border-radius:8px 0 8px 8px}
.stbox .nm{font-family:var(--pixel);font-size:clamp(7px,1.5vw,10px);line-height:1.35;display:flex;justify-content:space-between;gap:8px}
.stbox .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stbox .nm span:last-child{flex:none}
.hpline{display:flex;align-items:center;gap:6px;margin-top:5px}
.hpline .lab{font-family:var(--pixel);font-size:7px;color:var(--gold-ink);background:#FFF1C4;padding:2px 3px;border-radius:2px}
.hpbar{flex:1;height:8px;border:2px solid var(--line);border-radius:4px;background:#E8ECF4;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--hp-hi);transition:width .6s steps(12),background .3s}
.hpnum{font-family:var(--mono);font-size:clamp(10px,1.8vw,13px);text-align:right;font-variant-numeric:tabular-nums;margin-top:2px}
.xpbar{height:4px;background:#E8ECF4;margin-top:4px;border-radius:2px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--xp);transition:width .6s}
.tbadge{position:absolute;right:3%;top:5%;display:flex;gap:4px}
.tbadge i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:#fff}
.tbadge i.dead{background:#9aa0b4}
.tbadge i.alive{background:var(--gold)}
.leader{position:absolute;right:4%;top:6%;width:13%;aspect-ratio:10/14}
.leader.leave{animation:slideOut .5s steps(6) forwards}
@keyframes slideOut{to{transform:translateX(200%)}}

.msg{margin:12px;border:4px double var(--line);border-radius:8px;background:#fff;padding:12px 40px 12px 14px;min-height:62px;font-family:var(--pixel);font-size:clamp(9px,1.8vw,12px);line-height:1.8;position:relative;cursor:pointer}
.msg .more{position:absolute;right:14px;bottom:10px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--ink);animation:bob .8s steps(2) infinite;opacity:0}
.msg.done .more{opacity:1}
@keyframes bob{50%{transform:translateY(3px)}}

.qpanel{padding:0 12px 14px;display:flex;flex-direction:column;gap:10px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qhead .mv{font-family:var(--pixel);font-size:10px}
.qhead .hint{font-size:12.5px;color:var(--mute)}
.stem{margin:0;font-size:16px;max-width:70ch}
.chart{border:2px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.chart .ch{display:flex;justify-content:space-between;gap:10px;background:var(--ink);color:#fff;padding:5px 10px;font-family:var(--pixel);font-size:8px;line-height:1.6}
.chart .cr{display:grid;grid-template-columns:100px 1fr;border-top:1px solid #D7DCEA}
.chart .cr:first-of-type{border-top:0}
.chart .sys{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:7px 10px;background:#F4F6FB}
.chart .fx{padding:7px 10px;font-size:14.5px}
.chart .cr.hid .fx{color:#A8AEC4;font-style:italic}
.chart .cr.new{animation:flash 1s}
@keyframes flash{from{background:#FFF1C4}}
.chart .cr.hist .sys{background:#FFF7DA}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:600px){.moves{grid-template-columns:1fr}}
.move{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;text-align:left;background:#fff;border:3px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14.5px;line-height:1.4;box-shadow:0 3px 0 var(--line)}
.move:hover{background:#FFF8DE}
.move:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.move .k{font-family:var(--pixel);font-size:9px;background:var(--ink);color:#fff;border-radius:4px;height:22px;display:grid;place-items:center}
.move.gone{opacity:.3;text-decoration:line-through;pointer-events:none}
.cmds{display:flex;gap:8px;flex-wrap:wrap}
.cmd{background:#fff;border:3px solid var(--line);border-radius:6px;padding:8px 12px;font-family:var(--pixel);font-size:9px;line-height:1.3}
.cmd:hover{background:#FFF8DE}
.cmd[disabled]{opacity:.4;pointer-events:none}
.cmd.examine{background:#EAF3FF}
.sub{border:2px dashed var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#fff}
.sub .opt{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.fb{display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--pixel);font-size:11px;padding:9px 12px;border-radius:6px;border:3px solid}
.verdict.ok{background:var(--good-soft);border-color:var(--good);color:#0E4A2D}
.verdict.no{background:var(--bad-soft);border-color:var(--bad);color:#6B1B10}
.verdict.tr{background:var(--trap-soft);border-color:var(--trap);color:var(--trap)}
.ans{font-size:15px}
.ans b{font-weight:600}
.whys{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.whys small{display:block;color:var(--mute)}
.recall{font-size:15px}

/* ---------- lists / dex / party ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.sheet{background:#fff;color:var(--ink);border:3px solid var(--line);border-radius:8px;padding:14px;overflow-x:auto}
.sheet h2{font-family:var(--pixel);font-size:11px;line-height:1.5;margin:18px 0 8px}
.sheet table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.sheet th,.sheet td{border-bottom:1px solid #D5D9E5;padding:7px 8px;text-align:left;vertical-align:top}
.sheet th{background:var(--ink);color:#fff;font-weight:600;position:sticky;top:0}
.sheet td,.sheet td b,.sheet p,.sheet h2{color:var(--ink)}
.sheet td small{display:block;color:var(--mute)}
.sheet .area{font-family:var(--mono);font-size:11.5px;color:var(--mute);white-space:nowrap}
.sheet .hy{margin:10px 0}
.atlas-sec{font-family:var(--pixel);font-size:10px;line-height:1.5;margin:20px 0 8px;padding-bottom:6px;border-bottom:3px solid var(--line);color:var(--ink)}
.srch{width:100%;padding:9px 11px;border:3px solid var(--line);border-radius:6px;font:15px var(--body);background:#fff;color:var(--ink);color-scheme:light}
.pdfcard{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
details.tog{margin:6px 0}
.atree{display:flex;flex-direction:column;gap:8px;margin-left:14px;padding-left:10px;border-left:3px solid #C9D0E0}
.atree.top{margin-left:0;padding-left:0;border-left:0}
details.grp>summary{font-family:var(--pixel);font-size:9px;line-height:1.6;color:var(--ink)}
details.nerve>summary{font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:6px;padding:6px 10px}
details.tog>summary{cursor:pointer;list-style:none;padding:6px 0}
details.tog>summary::before{content:'▸ ';color:var(--gold-ink);font-size:14px}
details.tog[open]>summary::before{content:'▾ '}
details.tog>summary::-webkit-details-marker{display:none}
.tab{background:#fff;border:3px solid var(--line);border-radius:6px;padding:7px 10px;font-family:var(--pixel);font-size:8.5px;line-height:1.3}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.dexe{background:#fff;border:2px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;line-height:1.25}
.dexe .spr{width:64px;height:72px}
.dexe .no{font-family:var(--mono);font-size:10px;color:var(--mute)}
.dexe.unseen{background:#EEF0F6;color:#8C93AE}
.dexe.caught{box-shadow:inset 0 0 0 2px var(--gold)}
.card{background:#fff;border:3px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:18px}
.lin{font-size:13px;color:var(--mute)}
.fx-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.fx-list li{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:14px;border-top:1px solid #E1E5EF;padding-top:6px}
.fx-list li span:first-child{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--mute);letter-spacing:.04em}
.fx-list small{display:block;color:var(--mute)}
.party{display:flex;flex-direction:column;gap:8px}
.pm{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:10px;padding:8px 10px}
.pm .spr{width:56px;height:63px}
.pm.lead{box-shadow:0 0 0 3px var(--gold)}
.pm .nm{font-weight:600}
@media (max-width:480px){.pm{grid-template-columns:52px 1fr}.pm .act{grid-column:1/-1}}
.dexpatch{display:flex;flex-direction:column;gap:6px}
.dexhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:3px solid var(--line);padding-bottom:6px}
.dexlist{display:flex;flex-direction:column;gap:4px}
.dexsub{font-family:var(--pixel);font-size:8.5px;color:var(--mute);margin:6px 0 2px;letter-spacing:.03em}
.dexrow{margin-left:calc(var(--d,0)*22px);display:grid;grid-template-columns:auto 38px 44px 1fr auto;align-items:center;gap:8px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:6px;padding:4px 8px;font-size:14px;line-height:1.25;max-width:calc(100% - 0px)}
.dexrow .spr{width:32px;height:36px}
.dexrow .no{font-family:var(--mono);font-size:10px;color:var(--mute)}
.dexrow .dn small{display:block;color:var(--mute);font-size:11.5px}
.dexrow .twig{font-family:var(--mono);color:var(--mute)}
.dexrow:not(:has(.twig)){grid-template-columns:38px 44px 1fr auto}
.dexrow.unseen{background:#EEF0F6;color:#8C93AE}
.dexrow.caught{box-shadow:inset 0 0 0 2px var(--gold)}
.dexrow .tag{font-family:var(--pixel);font-size:7px;background:var(--gold);color:#241A00;border-radius:3px;padding:3px 5px}
.dexrow .tag.seen{background:#9DB4D8;color:#1B2033}
@media (max-width:520px){.dexrow{margin-left:calc(var(--d,0)*12px)}.dexrow .twig{display:none}.dexrow{grid-template-columns:38px 36px 1fr!important}.dexrow .tag{grid-column:3}}
.misslist{display:flex;flex-direction:column;gap:6px}
.missi{display:flex;justify-content:space-between;gap:10px;background:#fff;border:2px solid var(--line);border-radius:6px;padding:7px 10px;font-size:14px}
.missi b{font-family:var(--mono);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--pixel);font-size:9px;padding:10px 14px;border-radius:6px;border:2px solid var(--gold);z-index:20;line-height:1.6;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.dexe{font:inherit;color:inherit}
.dexe[disabled]{cursor:default}

ger", "n": 15}, "bosses": [{"lo": "22.1", "name": "The Disease Modifier", "epithet": "Slows the erosion, not just the pain", "los": "Why DMARDs and biologics are used", "q": [["2", "Why add a DMARD rather than relying on NSAIDs or steroids in RA?", ["DMARDs work faster", "DMARDs slow joint damage; NSAIDs/steroids only relieve symptoms", "DMARDs have no toxicity", "NSAIDs are contraindicated in RA", "Steroids worsen erosions immediately"], 1, "Disease-modifying = prevents erosions and deformity."], ["2", "What distinguishes a biologic from a conventional DMARD?", ["Biologics are oral", "Biologics are proteins from living material that block one cytokine or receptor and must be injected", "Biologics inhibit purine synthesis", "Biologics are cheaper", "Biologics never cause infection"], 1, "Biologics: injected, expensive, targeted, immunogenic."], ["2", "The suffix \"-ximab\" (e.g., infliximab, rituximab) indicates:", ["Human mAb", "Humanized mAb", "Chimeric mouse/human mAb", "Fusion receptor", "Receptor antagonist"], 2, "xi = mixed. -zumab humanized, -umab human, -cept fusion receptor, -ra receptor antagonist."], ["2", "About what fraction of RA patients are controlled with oral DMARDs alone?", ["10%", "25%", "50%", "90%", "100%"], 2, "About half; biologics fill in the rest. Methotrexate is the cornerstone."], ["S1", "A 45-year-old woman has symmetric MCP and wrist swelling with 2 hours of morning stiffness despite naproxen. Anti-CCP is positive. Best next drug?", ["Long-term high-dose prednisone", "Low-dose weekly methotrexate", "Allopurinol", "Colchicine", "Etanercept as monotherapy before any DMARD"], 1, "Methotrexate is first-line DMARD in RA; add a biologic if still active."]]}, {"lo": "22.2", "name": "The Target Keeper", "epithet": "Measure, adjust, measure again", "los": "Treat to target in RA", "q": [["2", "What does \"treat to target\" mean in RA?", ["Treat until symptoms vanish once, then stop", "Measure disease activity and adjust therapy until low activity <script>
"use strict";
(function(){
/* ================= utilities ================= */
const app=document.getElementById('app'), hud=document.getElementById('hud');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

const LET=['A','B','C','D','E'];
const tchip=t=>`<span class="tchip" style="background:${TYPES[t].c}">${TYPES[t].n.toUpperCase()}</span>`;

/* ================= species index ================= */
const SP={};SPECIES.forEach((s,i)=>{s.no=i+1;SP[s.id]=s;});

STARTERS.forEach(s=>SP[s.id]={id:s.id,n:s.n,t:s.t,starter:true});
const areaKeys=a=>SPECIES.filter(s=>s.a===a).map(s=>s.id);

/* ================= Leitner schedule (stage = box) ================= */
const BOX_IV=[0,1,3,6,10,16,25],BOX_MAX=6,LEECH_AT=3;
let G=null;const KEY=CFG.key;
function schedGet(k){if(!G.sched[k])G.sched[k]={b:0,d:0,s:0,l:0};return G.sched[k];}
const stageOf=b=>b<=1?1:b<=3?2:3;
function monStage(k){if(!G||!G.sched||!k||k.startsWith('st:'))return 1;const s=G.sched[k];return s?stageOf(s.b):1;}
function isDue(k){const s=G.sched[k];return !!s&&s.s>0&&s.d<=G.enc;}
function schedRight(k){const s=schedGet(k);const was=stageOf(s.b);s.s++;s.b=Math.min(BOX_MAX,s.b+1);s.d=G.enc+BOX_IV[s.b];const now=stageOf(s.b);return now>was?{up:true,to:now}:null;}
function schedWrong(k){const s=schedGet(k);const was=stageOf(s.b);s.s++;s.l++;s.b=0;s.d=G.enc;const now=stageOf(s.b);return now<was?{up:false,to:now}:null;}
const dueKeys=()=>Object.keys(G.sched).filter(k=>SP[k]&&isDue(k)).sort((a,b)=>G.sched[a].d-G.sched[b].d);

/* ================= sprites (reused from Neuromon) ================= */
/* ================= sprites (procedural, original) ================= */
const spriteCache={};
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  if(f<0){r*=1+f;g*=1+f;b*=1+f;}else{r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f;}
  return '#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');}
function genGrid(key,st){
  /* Stage keeps the SAME seed, so an evolution is recognisably the same creature
     grown up — bigger body, more dendrites — rather than a different species. */
  const stg=st||1;const ck=stg>1?key+'|'+stg:key;
  if(spriteCache[ck])return spriteCache[ck];
  const r=rng(hash(key));const W=16,H=18,half=8;const g=[...Array(H)].map(()=>Array(W).fill(0));
  const wide=(.75+r()*.5)*(1+(stg-1)*.15), tall=(.55+r()*.35)*(1+(stg-1)*.11);
  for(let y=3;y<H-1;y++)for(let x=1;x<half;x++){
    const dx=(half-1-x)/half, dy=Math.abs(y-10.5)/7.5;
    const p=1.05-dx*1.05/wide-dy*dy*tall*1.1+(r()-.5)*.45;
    if(r()<p){g[y][x]=1;g[y][W-1-x]=1;}
  }
  // keep component connected to center
  const seen=new Set();const stk=[[10,7]];
  if(!g[10][7]){g[10][7]=g[10][8]=1;}
  while(stk.length){const [y,x]=stk.pop();const k=y*W+x;if(seen.has(k)||y<0||y>=H||x<0||x>=W||!g[y][x])continue;seen.add(k);stk.push([y+1,x],[y-1,x],[y,x+1],[y,x-1]);}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(g[y][x]&&!seen.has(y*W+x))g[y][x]=0;
  // dendrites
  let top=H;for(let y=0;y<H;y++)if(g[y].some(v=>v)){top=y;break;}
  const nd=1+Math.floor(r()*2)+(stg-1);
  for(let i=0;i<nd;i++){let x=2+Math.floor(r()*5);let y=top;while(y<H-1&&!g[y][x])y++;
    for(let s=0;s<3+(stg-1)&&y>0;s++){y--;if(r()<.4)x=Math.max(1,Math.min(half-1,x+(r()<.5?-1:1)));g[y][x]=g[y][x]||3;g[y][W-1-x]=g[y][W-1-x]||3;}}
  // eyes
  let eye=null;
  for(let y=top+1;y<H-4&&!eye;y++){for(const ex of [5,4,6,3]){if(g[y][ex]===1&&g[y+1][ex]===1&&g[y][ex-1]&&g[y][ex+1]&&g[y+1][ex]){eye=[y,ex];break;}}}
  const out={g,W,H,eye,hue:r(),stg};
  return spriteCache[ck]=out;
}
function spriteSVG(key,opt={}){
  const sp=SP[key];const base=sp?TYPES[sp.t].c:'#888';
  const stg=opt.stage||monStage(key);           // every render site evolves without being told to
  const {g,W,H,eye,hue}=genGrid(key,stg);
  const body=shade(base,(hue-.5)*.35), hi=shade(body,.35), lo=shade(body,-.3), acc=shade(base,.55+(stg-1)*.14), ol='#1B2033';
  const sil=opt.sil;let rects='';
  const at=(y,x)=>y>=0&&y<H&&x>=0&&x<W?g[y][x]:0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const v=g[y][x];
    if(!v){if(at(y-1,x)||at(y+1,x)||at(y,x-1)||at(y,x+1))rects+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${sil?'#1B203355':ol}"/>`;continue;}
    let c;
    if(sil)c='#1B203340';
    else if(v===3)c=acc;
    else if(opt.back)c=!at(y+1,x)?lo:(!at(y-1,x)?body:shade(body,-.12));
    else c=!at(y-1,x)?hi:(!at(y+1,x)?lo:((x>5&&x<10&&y>11&&y<15)?shade(body,.2):body));
    rects+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`;
  }
  if(eye&&!opt.back&&!sil){const [y,ex]=eye;[ex,W-1-ex].forEach(x=>{rects+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#fff"/><rect x="${x}" y="${y+1}" width="1" height="1" fill="${ol}"/>`;});}
  return `<svg class="${opt.cls||'spr'}" viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
}
const TRAINER=["...HHHH...","..HHHHHH..",".HHHHHHHH.","..SSSSSS..","..SESSES..","..SSSSSS..","...SMMS...","..WCCCCW..",".WWCCCCWW.",".SWCCCCWS.",".SWWCCWWS.","..PPPPPP..","..PP..PP..","..BB..BB.."];

 or:{mv:'ORIGIN',hint:'Where does it come from?',lab:'Origin',stem:S=>`What does <strong>${esc(S.n)}</strong> arise from?`,rev:v=>`Which structure arises from <strong>${esc(v)}</strong>?`,chain:'what does it arise from?',desc:'arises from'},

 fa:{mv:'FAILURE',hint:'If it fails…',lab:'If it fails',stem:S=>`If <strong>${esc(S.n)}</strong> fails to develop normally, what results?`,rev:v=>`A child has <strong>${esc(v)}</strong>. Which structure failed?`,chain:'what results if it fails?',desc:'when it fails causes'},
 fx:{mv:'ROOT CAUSE',hint:'What failed?',lab:'What failed',stem:S=>`In <strong>${esc(S.n)}</strong>, which structure or process failed?`,rev:v=>`Failure of <strong>${esc(v)}</strong> causes which defect?`,chain:'what failed?',desc:'results from failure of'},
 cl:{mv:'PRESENTATION',hint:'How does it present?',lab:'Presentation',stem:S=>`Which picture fits <strong>${esc(S.n)}</strong>?`,rev:v=>`A patient has <strong>${esc(v)}</strong>. What is the diagnosis?`,chain:'how does it present?',desc:'presents with'}
};
const F=CFG.fields, S1F=CFG.s1, S2F=CFG.s2;
function sameAreaFirst(S,list){const a=shuffle(list.filter(x=>x.a===S.a)),b=shuffle(list.filter(x=>x.a!==S.a));return [...a,...b];}
function fieldQ(S,k){const v=S[k];if(!v)return null;
  const pool=[...new Set(sameAreaFirst(S,SPECIES.filter(x=>x.id!==S.id&&x[k]&&x[k]!==v)).map(x=>x[k]))].slice(0,3);if(pool.length<3)return null;
  const opts=shuffle([v,...pool]);
  return {sig:'f:'+k,mv:F[k].mv,hint:F[k].hint,stem:F[k].stem(S),opts,ans:opts.indexOf(v),explain:`<p class="ans"><b>${esc(v)}</b></p>`,kind:'recall'};}
function revQ(S,k){const v=S[k];if(!v||!F[k].rev)return null;
  const pool=sameAreaFirst(S,SPECIES.filter(x=>x.id!==S.id&&x[k]&&x[k]!==v&&x.t!=='DEFECT'===(S.t!=='DEFECT'))).map(x=>x.n);const d=[...new Set(pool)].slice(0,3);if(d.length<3)return null;
  const opts=shuffle([S.n,...d]);
  return {sig:'r:'+k,mv:'REVERSE '+F[k].mv,hint:'Name the drug or condition',stem:F[k].rev(v),opts,ans:opts.indexOf(S.n),explain:`<p class="ans"><b>${esc(S.n)}</b> ${F[k].desc} ${esc(v)}.</p>`,kind:'reverse'};}
function chainQ(S){const giv=shuffle(CFG.chainGive.filter(k=>S[k])),ask=shuffle(CFG.chainAsk.filter(k=>S[k]));
  for(const g of giv)for(const a of ask){if(a===g)continue;const base=fieldQ(S,a);if(!base)continue;
    base.sig='c:'+g+a;base.mv='2ND ORDER';base.hint='Identify it, then answer';base.kind='chain';
    base.stem=`Think in two steps. The drug or condition that <em>${F[g].desc} “${esc(S[g])}”</em> — ${F[a].chain}`;
    base.explain=`<p class="ans">That is <b>${esc(S.n)}</b>, which ${F[a].desc} <b>${esc(S[a])}</b>.</p>`;return base;}
  return null;}
function vignQ(S){const bank=BOSS[S.lo.split('.')[0]];if(!bank)return null;const qs=[];bank.bosses.forEach(b=>{if(b.lo===S.lo)b.q.forEach(q=>qs.push(q));});if(!qs.length)return null;
  const q=pick(qs);const ord=shuffle([0,1,2,3,4]);const opts=ord.map(i=>q[2][i]);
  return {sig:'v:'+hash(q[1]),mv:q[0]==='S1'?'STEP 1 STRIKE':'2ND ORDER',hint:q[0]==='S1'?'Clinical vignette':'Two-step reasoning',stem:esc(q[1]),opts,ans:ord.indexOf(q[3]),explain:`<p class="ans"><b>${esc(q[2][q[3]])}</b></p><p>${esc(q[4])}</p>`,kind:'vignette'};}
function identifyQ(S,E){const nw=S.n.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>=4&&!['cell','cells','face'].includes(w));
  const leak=t=>{const l=t.toLowerCase();return nw.some(w=>l.includes(w));};
  let rows=CFG.idOrder.filter(k=>S[k]).map(k=>[F[k].lab,S[k]]);
  const clean=rows.filter(r=>!leak(r[1]));if(clean.length>=2)rows=clean;
  const same=shuffle(SPECIES.filter(x=>x.id!==S.id&&x.t===S.t)),near=shuffle(SPECIES.filter(x=>x.id!==S.id&&x.t!==S.t&&x.a===S.a));
  const d=[...same,...near].map(x=>x.n).filter((v,i,a)=>a.indexOf(v)===i).slice(0,4);const opts=shuffle([S.n,...d]);
  return {sig:'id',mv:'IDENTIFY',hint:'Read its record, then name it',rows,shown:E.shown,stem:`A wild ${MON} is hiding its name. Which drug or condition has this record?`,opts,ans:opts.indexOf(S.n),kind:'identify',
    explain:`<ul class="whys">${rows.map(r=>`<li><b>${esc(r[0])}:</b> ${esc(r[1])}</li>`).join('')}</ul>`};}
function nextQ(E){const S=SP[E.sp];const st=Math.max(monStage(E.sp),E.minStage||1);let cands=[];
  const add=q=>{if(q&&!E.asked.has(q.sig))cands.push(q);};
  if(st===1){S1F.forEach(k=>add(fieldQ(S,k)));CFG.rev1.forEach(k=>add(revQ(S,k)));}
  else if(st===2){S2F.forEach(k=>add(fieldQ(S,k)));CFG.rev2.forEach(k=>add(revQ(S,k)));add(chainQ(S));add(chainQ(S));}
  if(st===3||(st===2&&Math.random()<.35)){for(let i=0;i<3;i++)add(vignQ(S));add(chainQ(S));}
  if(!cands.length){S1F.concat(S2F).forEach(k=>add(fieldQ(S,k)));add(chainQ(S));add(vignQ(S));}
  if(!cands.length){E.asked.clear();return nextQ(E);}
  return pick(cands);}

/* ================= encounters ================= */
function enemyLevel(){return 3+Object.keys(G.badges).length*3+Math.floor(Math.random()*4);}
function mkEnemy(sp,o={}){return {sp,hp:100,max:100,lvl:o.lvl||enemyLevel(),hidden:true,shown:2,asked:new Set(),missed:0,minStage:o.minStage||1};}
function startWild(area,patch){const keys=patchKeys(area,patch);
  const w=keys.flatMap(k=>Array((G.dex[k]==='caught'?1:G.dex[k]?2:4)+(isDue(k)?3:0)).fill(k));
  battle({kind:'wild',area,patch,queue:[mkEnemy(pick(w))]});}
function startGym(id){if(id==='summit'&&Object.keys(G.badges).filter(k=>k!=='summit').length<CHAMP_NEED)return;
  const g=GYMS[id];const pool=id==='summit'?SPECIES.map(s=>s.id):areaKeys(id);
  const pri=shuffle(pool).sort((a,b)=>(isDue(b)-isDue(a)));const team=[];
  const types=new Set();pri.forEach(k=>{if(team.length<g.size&&!types.has(SP[k].p)){team.push(k);types.add(SP[k].p);}});pri.forEach(k=>{if(team.length<g.size&&!team.includes(k))team.push(k);});
  battle({kind:'gym',gym:id,queue:team.map(k=>mkEnemy(k,{lvl:g.lvl,minStage:id==='summit'?3:2}))});}
function startReview(){const due=dueKeys().slice(0,6);if(!due.length)return;battle({kind:'review',queue:due.map(k=>mkEnemy(k))});}

function renderBattle(enter){app.innerHTML=sceneHTML(enter)+`<div class="msg" id="msg"></div><div class="qpanel" id="qp"></div>`;}
function say(t){const m=document.getElementById('msg');if(m){m.innerHTML=t+'<span class="more"></span>';m.classList.add('done');}}
function turn(){const E=B.E,S=SP[E.sp];
  let intro='';if(!B.saidIntro){intro=B.kind==='gym'?`${GYMS[B.gym].leader} sent out an ${MON}!`:B.kind==='review'?`A due ${MON} returns for review!`:`A wild ${MON} appeared in the tall grass!`;B.saidIntro=true;}

  const P=lead(),PS=SP[P.sp];
  document.getElementById('qp').innerHTML=`<div class="qhead"><span class="tchip" style="background:${TYPES[PS.t].c}">${esc(q.mv)}</span><span class="hint">${esc(q.hint)}</span></div>

function anim(id,cls){const el=document.getElementById(id);if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}
function answer(i){const q=B.q,E=B.E,S=SP[E.sp],P=lead(),PS=SP[P.sp];const ok=i===q.ans;G.tot++;
  document.querySelectorAll('.move').forEach((b,j)=>{b.disabled=true;if(j===q.ans)b.style.background='var(--good-soft)';else if(j===i)b.style.background='var(--bad-soft)';});
  E.asked.add(q.sig);
  if(ok){G.right++;const bonus=PS.t===S.t?1.5:1;const dmg=Math.round((q.kind==='identify'?30:34)*bonus*(q.kind==='vignette'||q.kind==='chain'?1.2:1));
    E.hp=Math.max(0,E.hp-dmg);if(q.kind==='identify'){E.hidden=false;seen(E.sp,'seen');}
    P.xp+=12;let lv='';while(P.xp>=P.lvl*10){P.xp-=P.lvl*10;P.lvl++;const f=P.hp/P.max;P.max=maxHP(P.lvl);P.hp=Math.max(P.hp,Math.round(P.max*f));lv=`${PS.n} grew to Lv${P.lvl}! `;}
    anim('monP','lunge');setTimeout(()=>anim('monE','hit'),200);
    feedback(true,q,`${esc(PS.n)} used ${esc(TYPES[PS.t].atk)}!${bonus>1?' It\'s super effective!':''} ${lv}`);}
  else{E.missed++;if(q.kind==='identify')E.shown=Math.min(q.rows.length,E.shown+1);
    const dmg=8+E.lvl;P.hp=Math.max(0,P.hp-dmg);anim('monE','lunge');setTimeout(()=>{anim('monP','hit');anim('scene','shake');},200);
    feedback(false,q,`${E.hidden?'The wild '+MON:esc(S.n)} used ${esc(TYPES[S.t].atk)}! ${esc(PS.n)} took ${dmg} damage.`);}
  persist();}
function feedback(ok,q,line){const E=B.E,S=SP[E.sp];
  document.getElementById('hpE').style.width=(E.hp/E.max*100)+'%';document.getElementById('hpE').style.background=hpColor(E.hp/E.max);
  const P=lead();document.getElementById('hpP').style.width=(P.hp/P.max*100)+'%';document.getElementById('hpP').style.background=hpColor(P.hp/P.max);
  say(line);
  const qp=document.getElementById('qp');const fb=document.createElement('div');fb.className='fb';
  fb.innerHTML=`<div class="verdict ${ok?'ok':'no'}">${ok?'CORRECT!':'NOT QUITE'}</div>${ok?'':`<p class="ans">Answer: <b>${esc(q.opts[q.ans])}</b></p>`}${q.explain}${!E.hidden&&S.pearl&&(!ok||q.kind==='identify')?`<div class="hy"><b>HIGH-YIELD · ${esc(S.n).toUpperCase()}</b>${esc(S.pearl)}</div>`:''}<div class="row"><button class="btn gold" id="cont">Continue &gt;</button></div>`;
  qp.querySelector('.cmds')?.remove();qp.appendChild(fb);const c=document.getElementById('cont');c.focus({preventScroll:true});
  c.onclick=()=>{if(E.hp<=0)return enemyDown();if(P.hp<=0)return leadDown();turn();};}
function enemyHits(line){const E=B.E,P=lead();const dmg=8+E.lvl;P.hp=Math.max(0,P.hp-dmg);E.missed++;renderBattle(false);anim('scene','shake');say(line+` ${esc(SP[P.sp].n)} took ${dmg} damage.`);
  document.getElementById('qp').innerHTML='<div class="row"><button class="btn gold" id="cont">Continue &gt;</button></div>';
  document.getElementById('cont').onclick=()=>{if(P.hp<=0)return leadDown();turn();};persist();}
function leadDown(){const P=G.party.find(m=>m.hp<=0&&m===G.party[0])||G.party.find(m=>m.hp<=0);
  const alive=G.party.filter(m=>m.hp>0);
  if(!alive.length){say(`All your ${MON} fainted! You hurried back to the ${CFG.center}.`);healAll();G.loc='center';
    if(B.E&&!B.E.hidden){const ch=schedWrong(B.E.sp);if(ch)toast(`${SP[B.E.sp].n} devolved to stage ${ch.to}`);}
    persist();document.getElementById('qp').innerHTML='<div class="row"><button class="btn gold" id="cont">Back to map &gt;</button></div>';document.getElementById('cont').onclick=()=>go('map');return;}
  G.party=[alive[0],...G.party.filter(m=>m!==alive[0])];persist();renderBattle(false);say(`Your ${MON} fainted! Go, ${esc(SP[alive[0].sp].n)}!`);
  document.getElementById('qp').innerHTML='<div class="row"><button class="btn gold" id="cont">Continue &gt;</button></div>';document.getElementById('cont').onclick=turn;}
function settle(E){const ch=E.missed===0?schedRight(E.sp):schedWrong(E.sp);
  if(ch){const n=SP[E.sp].n;toast(ch.up?`${n} evolved to stage ${ch.to}! Its questions get harder.`:`${n} dropped to stage ${ch.to}.`);}}
function enemyDown(){const E=B.E,S=SP[E.sp];anim('monE','faint');
  if(B.kind==='wild'||B.kind==='review'){
    if(G.dex[E.sp]!=='caught'){say(`${esc(S.n)} is weakened! Throw an ${CFG.orb}? You must answer one more question to catch it.`);
      document.getElementById('qp').innerHTML=`<div class="row"><button class="btn gold" id="orb">Throw ${CFG.orb}</button><button class="btn ghost" id="let">Let it go</button></div>`;
      document.getElementById('orb').onclick=captureQ;document.getElementById('let').onclick=()=>{settle(E);nextEnemy();};return;}
    say(`${esc(S.n)} fainted! Your team gained experience.`);settle(E);}
  else{say(`${esc(S.n)} fainted!`);settle(E);}
  persist();document.getElementById('qp').innerHTML='<div class="row"><button class="btn gold" id="cont">Continue &gt;</button></div>';document.getElementById('cont').onclick=nextEnemy;}
function captureQ(){const E=B.E,S=SP[E.sp];const q=nextQ(Object.assign({},E,{minStage:Math.max(2,monStage(E.sp))}));B.q=q;
  const scene=document.getElementById('scene');const orb=document.createElement('div');orb.className='orb';orb.innerHTML=ORB;scene.appendChild(orb);
  setTimeout(()=>orb.classList.add('wobble'),700);
  say('The orb wobbles… answer to seal it!');
  document.getElementById('qp').innerHTML=`<div class="qhead"><span class="tchip" style="background:var(--gold);color:#241A00">CAPTURE · ${esc(q.mv)}</span><span class="hint">${esc(q.hint)}</span></div><p class="stem">${q.stem}</p>
    <div class="moves">${q.opts.map((o,i)=>`<button class="move" data-i="${i}"><span class="k">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  document.querySelectorAll('.move').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ok=i===q.ans;G.tot++;if(ok)G.right++;else E.missed++;
    document.querySelectorAll('.move').forEach((x,j)=>{x.disabled=true;if(j===q.ans)x.style.background='var(--good-soft)';else if(j===i)x.style.background='var(--bad-soft)';});
    if(ok){seen(E.sp,'caught');const m=newMon(E.sp,Math.max(3,E.lvl-1));if(G.party.length<6)G.party.push(m);else G.box.push(m);say(`Gotcha! ${esc(S.n)} was caught!${G.party.length>=6&&G.party.indexOf(m)<0?' It was sent to the box.':''}`);}
    else{document.querySelector('.orb')?.remove();say(`Oh no! ${esc(S.n)} broke free and fled!`);}
    settle(E);persist();
    const qp=document.getElementById('qp');const fb=document.createElement('div');fb.className='fb';
    fb.innerHTML=`<div class="verdict ${ok?'ok':'no'}">${ok?'CAUGHT!':'IT FLED'}</div>${ok?'':`<p class="ans">Answer: <b>${esc(q.opts[q.ans])}</b></p>`}${q.explain}${S.pearl?`<div class="hy"><b>HIGH-YIELD · ${esc(S.n).toUpperCase()}</b>${esc(S.pearl)}</div>`:''}<div class="row"><button class="btn gold" id="cont">Continue &gt;</button></div>`;
    qp.appendChild(fb);document.getElementById('cont').onclick=nextEnemy;document.getElementById('cont').focus({preventScroll:true});});}
function nextEnemy(){B.i++;if(B.i<B.queue.length){B.E=B.queue[B.i];B.saidIntro=false;seen(B.E.sp,'seen');persist();renderBattle(true);turn();return;}endBattle(true);}
function endBattle(won,ran){if(B.kind==='gym'&&won){const g=GYMS[B.gym];const first=!G.badges[B.gym];G.badges[B.gym]=true;healAll();persist();
    app.innerHTML=`<div class="pane"><div class="gymcard">${trainerSVG(g.coat,g.hair)}<div style="display:flex;flex-direction:column;gap:8px"><div class="h2">${g.leader}</div><p class="lede">“${g.win}”</p>
    <div class="row">${badgeSVG(g.color,true)}<b>${first?'You earned the '+g.badge+'!':'Rematch won!'}</b></div><div class="small">Your team was healed.</div><div class="row"><button class="btn gold" id="cont">Back to map &gt;</button></div></div></div></div>`;
    document.getElementById('cont').onclick=()=>go('map');return;}
  persist();if(B.kind==='wild'&&!ran)go('route',B.area);else if(B.kind==='review'&&!ran)go('review');else go(B.area?'route':'map',B.area);}

/* ================= party / dex / review ================= */
function renderParty(){
  app.innerHTML=`<div class="pane"><div class="row" style="justify-content:space-between"><div class="h1">Party</div><button class="btn ghost" id="back">&lt; Map</button></div>
  <div class="party">${G.party.map((m,i)=>`<div class="pm ${i===0?'lead':''}">${spriteSVG(m.sp)}<div><div class="nm">${esc(SP[m.sp].n)} ${tchip(SP[m.sp].t)} ${stagePip(m.sp)}</div><div class="small">Lv${m.lvl} · ${m.hp}/${m.max} HP</div><div class="meter" style="max-width:220px"><i style="width:${m.hp/m.max*100}%;background:${hpColor(m.hp/m.max)}"></i></div></div>
    <div class="act">${i===0?'<span class="small">Lead</span>':`<button class="btn ghost" data-u="${m.uid}">Make lead</button>`}</div></div>`).join('')}</div>
  ${G.box.length?`<div class="h2">Box (${G.box.length})</div><div class="party">${G.box.map(m=>`<div class="pm">${spriteSVG(m.sp)}<div><div class="nm">${esc(SP[m.sp].n)} ${tchip(SP[m.sp].t)}</div><div class="small">Lv${m.lvl}</div></div><div class="act"><button class="btn ghost" data-b="${m.uid}">Swap into party</button></div></div>`).join('')}</div>`:''}</div>`;
  document.getElementById('back').onclick=()=>go('map');
  app.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const m=G.party.find(x=>x.uid===+b.dataset.u);G.party=[m,...G.party.filter(x=>x!==m)];persist();renderParty();});
  app.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const m=G.box.find(x=>x.uid===+b.dataset.b);const out=G.party.pop();G.box=G.box.filter(x=>x!==m).concat(out?[out]:[]);G.party.push(m);persist();renderParty();});}
function recordCard(S){const rows=CFG.idOrder.filter(k=>S[k]);
  return `<div class="card"><div class="row">${spriteSVG(S.id)}<div><h3>#${String(S.no).padStart(3,'0')} ${esc(S.n)}</h3><div class="row">${tchip(S.t)} ${stagePip(S.id,true)} <span class="small">LO ${esc(S.lo)} · ${esc(AREAS[S.a].name)}</span></div></div></div>
    <ul class="fx-list">${rows.map(k=>`<li><span>${F[k].lab}</span><span>${esc(S[k])}</span></li>`).join('')}</ul>${S.pearl?`<div class="hy"><b>HIGH-YIELD</b>${esc(S.pearl)}</div>`:''}</div>`;}
function renderDex(sel){const tab=(sel&&sel.tab)||'arch';const keys=areaKeys(tab);
  app.innerHTML=`<div class="pane"><div class="row" style="justify-content:space-between"><div class="h1">${CFG.dex}</div><button class="btn ghost" id="back">&lt; Map</button></div>
  <div class="tabs">${Object.entries(AREAS).map(([k,a])=>`<button class="tab" data-t="${k}" aria-pressed="${k===tab}">${a.name}</button>`).join('')}</div>
  <p class="small">Seen and caught ${MON} open their full record — use it as your study sheet. ${dexProgress(keys).c} of ${keys.length} caught here.</p>
  <div id="dexcard"></div>
  <div class="dexgrid">${keys.map(k=>{const S=SP[k],st=G.dex[k];return `<button class="dexe ${st||'unseen'}" data-k="${k}" ${st?'':'disabled'}>${spriteSVG(k,{sil:!st})}<span class="no">#${String(S.no).padStart(3,'0')}</span><span>${st?esc(S.n):'???'}</span>${st?stagePip(k):''}</button>`;}).join('')}</div></div>`;
  document.getElementById('back').onclick=()=>go('map');
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>renderDex({tab:b.dataset.t}));
  app.querySelectorAll('.dexe').forEach(b=>b.onclick=()=>{document.getElementById('dexcard').innerHTML=recordCard(SP[b.dataset.k]);document.getElementById('dexcard').scrollIntoView({block:'nearest'});});}
function renderReview(){const due=dueKeys();const st={1:0,2:0,3:0};Object.keys(G.sched).forEach(k=>{if(SP[k])st[stageOf(G.sched[k].b)]++;});
  const leech=Object.keys(G.sched).filter(k=>SP[k]&&G.sched[k].l>=LEECH_AT);
  const row=k=>`<div class="missi"><span>${esc(SP[k].n)} ${tchip(SP[k].t)} ${stagePip(k)}</span><b>${G.sched[k].l} miss${G.sched[k].l===1?'':'es'}</b></div>`;
  app.innerHTML=`<div class="pane"><div class="row" style="justify-content:space-between"><div class="h1">Review</div><button class="btn ghost" id="back">&lt; Map</button></div>
    <p class="lede">${MON} come back on a spaced schedule. A clean battle moves one up a box and pushes its next visit further out; any miss sends it back to box 0. Stage 1 asks recall, stage 2 asks failures and 2nd-order chains, stage 3 asks Step 1 vignettes.</p>
    <div class="mapfoot" style="padding:0"><div class="stat"><div class="k">TRACKED</div><div class="v">${Object.keys(G.sched).filter(k=>SP[k]).length}</div></div><div class="stat"><div class="k">STAGE 1 / 2 / 3</div><div class="v">${st[1]} · ${st[2]} · ${st[3]}</div></div><div class="stat"><div class="k">ACCURACY</div><div class="v">${G.tot?Math.round(100*G.right/G.tot)+'%':'—'}</div></div></div>
    ${due.length?`<div class="row"><button class="btn gold" id="rm">Run the due queue &gt;</button><span class="small">${due.length} due · a run pulls up to six</span></div><div class="misslist">${due.map(row).join('')}</div>`:'<div class="box">Nothing due right now. Go catch something new, or come back after a few more battles.</div>'}
    ${leech.length?`<div class="h2">Leeches <span class="small">(missed ${LEECH_AT}+ times — study their records in the ${CFG.dex})</span></div><div class="misslist">${leech.map(row).join('')}</div>`:''}</div>`;
  document.getElementById('back').onclick=()=>go('map');const rm=document.getElementById('rm');if(rm)rm.onclick=startReview;}

/* keyboard: A–E / 1–5 to answer, Enter to continue */
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Enter'){const c=document.getElementById('cont');if(c&&document.activeElement!==c){e.preventDefault();c.click();}return;}
  let i=LET.indexOf(e.key.toUpperCase());if(i<0){const n=parseInt(e.key,10);if(n>=1&&n<=5)i=n-1;}
  if(i>=0){const b=document.querySelectorAll('.move')[i];if(b&&!b.disabled)b.click();}});

/* ================= boot ================= */
G=load();if(G)go('map');else go('title');
})();

</script>
